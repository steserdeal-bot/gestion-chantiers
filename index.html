<script type="module">
import { html, render, useState, useEffect, useCallback, useMemo, useRef } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js';

// ---------- Connexion à Supabase ----------
const CONFIG_OK = !/VOTRE-PROJET|VOTRE-CLE/.test(window.SUPABASE_URL + window.SUPABASE_ANON_KEY);
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// ---------- Listes ----------
const STATUTS_CHANTIER = ['Soumission', 'Attribué', 'En cours', 'Arrêté', 'Réception provisoire', 'Clôturé'];
const TYPES_CAUTION = ['Provisoire', 'Définitive', 'Retenue de garantie', 'Avance'];
const STATUTS_CAUTION = ['Active', 'À restituer', 'Restituée'];
// Catégories par défaut (la liste réelle vient de la table categories_charges)
const CATEGORIES_DEFAUT = [
  ['Matériaux', '🧱', 'ciment, sable, fer, peinture, quincaillerie'], ['Plomberie et tuyaux', '🚰', 'poly, PVC, tube galva, raccords, vannes'],
  ['Matériel électrique et solaire', '⚡', 'câbles, disjoncteurs, panneaux'], ['Petit matériel et outillage', '🛠️', 'pelles, brouette, disques, vibreur'],
  ['Produits', '📦', 'produits achetés chez les fournisseurs'], ["Main d'œuvre", '👷', 'maâlem, ouvriers, avances aux ouvriers'],
  ['Charges sociales (CNSS)', '🏛️', 'CNSS des salariés'], ['Sous-traitance et forage', '🕳️', 'sondage, puits, tâcherons'],
  ['Location et transport', '🚜', 'tracteur, camion, moto, transit'], ['Carburant', '⛽', 'gasoil'],
  ['Missions et déplacements', '🏨', 'hôtel, repas, autoroute, taxi'], ['Loyers', '🏠', 'maison, garage, dépôt'],
  ['Installation de chantier', '⛺', 'gardien, baraque, eau, électricité'], ['Frais société', '📑', 'société, comptable, factures'], ['À préciser', '❓', 'lignes à classer'],
].map(([nom, icone, description], i) => ({ nom, icone, description, ordre: i + 1 }));
const ETATS = ['Sûr', 'À vérifier'];
const STATUTS_CHEQUE = ['Émis', 'Encaissé', 'Rejeté', 'Annulé'];
const MOIS = ['Janv', 'Févr', 'Mars', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sept', 'Oct', 'Nov', 'Déc'];

// ---------- Format ----------
const dh = (n) => Math.round(Number(n ?? 0)).toLocaleString('fr-FR');
const mdh = (n) => (n / 1e6).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' M';
const dateFr = (d) => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}` : '—';
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const num = (v) => { const n = Number(String(v ?? '').replace(/[\s  ]/g, '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const str = (v) => { const s = String(v ?? '').trim(); return s === '' ? null : s; };
const nb = (x) => Number(x ?? 0);

// ---------- Calculs ----------
function avancementPhysique(bpu, taches) {
  const total = bpu.reduce((a, b) => a + nb(b.quantite) * nb(b.prix_unitaire), 0);
  if (total > 0) return (bpu.reduce((a, b) => a + Math.min(nb(b.quantite_realisee), nb(b.quantite)) * nb(b.prix_unitaire), 0) / total) * 100;
  if (taches.length) return taches.reduce((a, t) => a + nb(t.avancement), 0) / taches.length;
  return 0;
}
const dateFinPrevue = (c) => (c.date_os && c.delai_jours ? addDays(c.date_os, nb(c.delai_jours) + nb(c.jours_arret)) : null);

function indicateurs(c, d) {
  const budget = nb(c.montant_marche);
  const facture = d.decomptes.reduce((a, x) => a + nb(x.montant_ttc), 0);
  const retenue = nb(c.taux_retenue) / 100;
  const encaisse = d.decomptes.filter((x) => x.encaisse).reduce((a, x) => a + nb(x.montant_ttc) * (1 - retenue), 0);
  const fraisCautions = d.cautions.reduce((a, x) => a + nb(x.frais), 0);
  const charges = d.depenses.reduce((a, x) => a + nb(x.montant_ttc), 0) + fraisCautions;
  const paye = d.depenses.reduce((a, x) => a + nb(x.montant_paye), 0) + fraisCautions;
  const avancement = c.avancement_manuel !== null && c.avancement_manuel !== undefined ? nb(c.avancement_manuel) : avancementPhysique(d.bpu, d.taches);
  const consommation = budget > 0 ? (charges / budget) * 100 : 0;
  const dateFin = dateFinPrevue(c);
  let delaiEcoulePct = null, joursRestants = null;
  const enCours = c.statut === 'En cours' || c.statut === 'Arrêté';
  if (c.date_os && c.delai_jours && enCours) {
    const ecoule = Math.max(0, daysBetween(c.date_os, today()) - nb(c.jours_arret));
    delaiEcoulePct = (ecoule / nb(c.delai_jours)) * 100;
    joursRestants = nb(c.delai_jours) - ecoule;
  }
  const raisons = [];
  if (enCours && consommation > avancement + 10) raisons.push(`${Math.round(consommation)} % du budget consommé pour ${Math.round(avancement)} % des travaux`);
  if (delaiEcoulePct !== null && delaiEcoulePct > avancement + 10) raisons.push(`${Math.round(delaiEcoulePct)} % du délai écoulé pour ${Math.round(avancement)} % des travaux`);
  if (joursRestants !== null && joursRestants < 0) raisons.push(`délai dépassé de ${-joursRestants} jours`);
  return {
    budget, facture, encaisse, resteAFacturer: budget - facture, charges, paye, marge: facture - charges,
    margePct: facture > 0 ? ((facture - charges) / facture) * 100 : null, consommation, avancement,
    delaiEcoulePct, joursRestants, dateFin,
    cautionsActives: d.cautions.filter((x) => x.statut !== 'Restituée').reduce((a, x) => a + nb(x.montant), 0),
    tachesRestantes: d.taches.filter((t) => nb(t.avancement) < 100).length, tachesTotal: d.taches.length,
    aRisque: raisons.length > 0, raisons,
  };
}

// ---------- Accès aux données ----------
function useTable(table, filtre, ordre) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const fcol = filtre?.col, fval = filtre?.val, ocol = ordre?.col, oasc = ordre?.asc ?? true;
  const reload = useCallback(async () => {
    let q = sb.from(table).select('*');
    if (fcol && fval) q = q.eq(fcol, fval);
    if (ocol) q = q.order(ocol, { ascending: oasc });
    const { data, error } = await q;
    setError(error ? error.message : null);
    setRows(data ?? []);
    setLoading(false);
  }, [table, fcol, fval, ocol, oasc]);
  useEffect(() => { reload(); }, [reload]);
  return { rows, loading, error, reload };
}
async function ecrire(p) {
  const { error } = await p;
  if (error) { alert('Erreur : ' + error.message); return false; }
  return true;
}
// Catégories : table categories_charges + catégories déjà utilisées dans les charges
function useCategories(depenses = []) {
  const t = useTable('categories_charges', null, { col: 'ordre' });
  const base = t.error || t.rows.length === 0 ? CATEGORIES_DEFAUT : t.rows;
  const noms = new Set(base.map((c) => c.nom));
  const extra = [...new Set(depenses.map((d) => d.categorie).filter((n) => n && !noms.has(n)))].map((nom) => ({ nom, icone: '📁', description: '', ordre: 200 }));
  return { liste: [...base, ...extra], reload: t.reload, tableOk: !t.error };
}
const iconeDe = (liste, nom) => liste.find((c) => c.nom === nom)?.icone ?? '📁';
async function nouvelleCategorie(reload) {
  const nom = (prompt('Nom de la nouvelle catégorie de charges :') || '').trim();
  if (!nom) return;
  const icone = (prompt('Un symbole pour la reconnaître (vous pouvez laisser 📁) :', '📁') || '📁').trim();
  if (await ecrire(sb.from('categories_charges').insert({ nom, icone }))) await reload();
}
const supprimer = async (table, id, question, reload) => {
  if (confirm(question) && await ecrire(sb.from(table).delete().eq('id', id))) await reload();
};

// ---------- Navigation (adresse après #) ----------
function useRoute() {
  const [h, setH] = useState(location.hash.slice(1) || '/');
  useEffect(() => { const f = () => setH(location.hash.slice(1) || '/'); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  return h;
}
const aller = (r) => { location.hash = r; };

// ---------- Petits composants ----------
const CLS = { 'Soumission': 'b-neutre', 'Attribué': 'b-alerte', 'En cours': 'b-info', 'Arrêté': 'b-alerte', 'Réception provisoire': 'b-ok', 'Clôturé': 'b-neutre', 'Active': 'b-info', 'À restituer': 'b-alerte', 'Restituée': 'b-ok', 'Émis': 'b-info', 'Encaissé': 'b-ok', 'Rejeté': 'b-risque', 'Annulé': 'b-neutre' };
const Badge = ({ statut, risque }) => risque ? html`<span class="badge b-risque">À risque</span>` : html`<span class=${'badge ' + (CLS[statut] ?? 'b-neutre')}>${statut}</span>`;
const Barre = ({ valeur, couleur, grande }) => html`<div class=${'barre' + (grande ? ' grande' : '')}><div style=${{ width: Math.max(0, Math.min(100, valeur)) + '%', background: couleur }}></div></div>`;
const Tuile = ({ l, v, s, couleur }) => html`<div class="tuile"><div class="l">${l}</div><div class="v" style=${couleur ? { color: couleur } : null}>${v}</div><div class="s">${s}</div></div>`;
const BtnSuppr = ({ onClick, label }) => html`<button type="button" class="btn danger petit" aria-label=${'Supprimer ' + label} onClick=${onClick}>×</button>`;
const Champ = ({ id, label, large, children }) => html`<div class=${'champ' + (large ? ' large' : '')}><label for=${id}>${label}</label>${children}</div>`;
const lireForm = (e) => { e.preventDefault(); return new FormData(e.currentTarget); };

// ---------- Connexion ----------
// Connexion par nom : « reda » devient reda@cedil-adpap.app côté Supabase (aucun email envoyé).
const DOMAINE_COMPTES = '@cedil-adpap.app';
function Login() {
  const [mode, setMode] = useState('connexion');
  const [erreur, setErreur] = useState(null);
  const [info, setInfo] = useState(null);
  const [attente, setAttente] = useState(false);
  async function envoyer(e) {
    const f = lireForm(e);
    setErreur(null); setInfo(null); setAttente(true);
    const nom = String(f.get('nom')).trim().toLowerCase().replace(/\s+/g, '.');
    const email = nom.includes('@') ? nom : nom + DOMAINE_COMPTES, password = String(f.get('password'));
    const res = mode === 'connexion' ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
    setAttente(false);
    if (res.error) return setErreur(res.error.message);
    if (mode === 'inscription' && !res.data.session) setInfo('Compte créé. Connectez-vous avec votre nom et votre mot de passe.');
  }
  return html`
    <div style=${{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: '16px' }}>

// ---------- Tableau de bord ----------
function badgeCaution(x) {
  const cls = x.statut === 'À restituer' ? 'b-alerte' : x.statut === 'Restituée' ? 'b-neutre' : 'b-ok';
  const suite = x.statut === 'Restituée' ? ' · rendue' : '';
  return html`<div style=${{ marginTop: '3px' }}><span class=${'badge ' + cls}>${x.type} ${dh(x.montant)}${suite}</span></div>`;
}

function TableauDeBord() {
  const societes = useTable('societes', null, { col: 'nom' });
  const chantiers = useTable('chantiers', null, { col: 'created_at', asc: false });
  const cautions = useTable('cautions');
  const bpu = useTable('articles_bpu');
  const decomptes = useTable('decomptes');
  const depenses = useTable('depenses');
  const taches = useTable('taches');
  const cheques = useTable('cheques');
  const fournisseurs = useTable('fournisseurs', null, { col: 'nom' });
  const [filtre, setFiltre] = useState('toutes');

  const lignes = useMemo(() => {
    const par = (rows, id) => rows.filter((r) => r.chantier_id === id);
    return chantiers.rows.filter((c) => filtre === 'toutes' || c.societe_id === filtre).map((c) => ({
      c, caut: par(cautions.rows, c.id),
      k: indicateurs(c, { cautions: par(cautions.rows, c.id), bpu: par(bpu.rows, c.id), decomptes: par(decomptes.rows, c.id), depenses: par(depenses.rows, c.id), taches: par(taches.rows, c.id) }),
    }));
  }, [chantiers.rows, cautions.rows, bpu.rows, decomptes.rows, depenses.rows, taches.rows, filtre]);

  const ids = new Set(lignes.map((l) => l.c.id));
  const somme = (f) => lignes.reduce((a, l) => a + f(l.k), 0);
  const budget = somme((k) => k.budget), charges = somme((k) => k.charges), encaisse = somme((k) => k.encaisse);
  const actifs = lignes.filter((l) => !['Clôturé', 'Réception provisoire'].includes(l.c.statut)).length;
  const intitule = (id) => chantiers.rows.find((c) => c.id === id)?.intitule ?? '';

  const t = today(), dans7 = addDays(t, 7), dans30 = addDays(t, 30);
  const alertes = [];
  lignes.forEach((l) => l.k.raisons.forEach((r) => alertes.push(`${l.c.intitule} : ${r}.`)));
  lignes.filter((l) => l.k.joursRestants !== null && l.k.joursRestants >= 0 && l.k.joursRestants <= 30).forEach((l) => alertes.push(`${l.c.intitule} : le délai se termine dans ${l.k.joursRestants} jours.`));
  cautions.rows.filter((x) => ids.has(x.chantier_id) && x.statut === 'À restituer').forEach((x) => alertes.push(`Caution ${x.type.toLowerCase()} de ${intitule(x.chantier_id)} à récupérer (${dh(x.montant)} DH).`));
  cautions.rows.filter((x) => ids.has(x.chantier_id) && x.statut !== 'Restituée' && x.date_echeance && x.date_echeance <= dans30).forEach((x) => alertes.push(`Caution ${x.type.toLowerCase()} de ${intitule(x.chantier_id)} : échéance le ${dateFr(x.date_echeance)}.`));
  fournisseurs.rows.forEach((f) => {
    const reste = depenses.rows.filter((d) => d.fournisseur_id === f.id).reduce((a, d) => a + nb(d.montant_ttc) - nb(d.montant_paye), 0);
    if (reste > 0.5) alertes.push(`${f.nom} : reste dû ${dh(reste)} DH.`);
  });
  const aProv = cheques.rows.filter((q) => q.statut === 'Émis' && q.date_echeance && q.date_echeance <= dans7);
  if (aProv.length) alertes.push(`${aProv.length} chèque(s) à échéance sous 7 jours : ${dh(aProv.reduce((a, q) => a + nb(q.montant), 0))} DH à provisionner.`);

  return html`
    <div class="entete">
      <div>
        <div class="discret">${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
        <h1 style=${{ marginTop: '4px' }}>Tableau de bord</h1>
        <div class="sous-titre">Tous vos marchés en un coup d'œil</div>
      </div>
      <div class="rangee">
        <div class="rangee" role="group" aria-label="Filtrer par société">
          <button type="button" class="pilule" aria-pressed=${String(filtre === 'toutes')} onClick=${() => setFiltre('toutes')}>Toutes</button>
          ${societes.rows.map((s) => html`<button key=${s.id} type="button" class="pilule" aria-pressed=${String(filtre === s.id)} onClick=${() => setFiltre(s.id)}>${s.nom}</button>`)}
        </div>
        <a href="#/nouveau" class="btn">+ Nouveau marché</a>
      </div>
    </div>
    ${(chantiers.error || societes.error) && html`<div class="erreur">Impossible de lire la base : ${chantiers.error || societes.error}. Avez-vous exécuté le fichier SQL dans Supabase ?</div>`}
    <div class="tuiles">
      <${Tuile} l="Marchés en cours" v=${actifs} s=${lignes.length + ' marché(s) au total'} />
      <${Tuile} l="Montant total des marchés" v=${dh(budget)} s="DH TTC" />
      <${Tuile} l="Encaissé (reçu du client)" v=${dh(encaisse)} couleur="var(--accent)" s=${(budget ? Math.round((encaisse / budget) * 100) : 0) + ' % des marchés'} />
      <${Tuile} l="Dépensé (charges + achats)" v=${dh(charges)} s="DH" />
      <${Tuile} l="Cautions bloquées" v=${dh(somme((k) => k.cautionsActives))} couleur="var(--alerte)" s="DH, toutes banques" />
    </div>
    ${alertes.length > 0 && html`<div class="bandeau"><b>⚠️ À faire</b><ul>${alertes.slice(0, 8).map((a) => html`<li>${a}</li>`)}</ul></div>`}
    <section class="carte">
      <div class="defile">
        <table style=${{ minWidth: '1180px' }}>
          <thead><tr><th>Marché</th><th>Maître d'ouvrage</th><th>Date du marché</th><th>Délai</th><th class="d">Montant</th><th>Avancement travaux</th><th>Financement (encaissé)</th><th class="d">Dépensé</th><th>Caution</th><th class="d">Bénéfice prévu</th></tr></thead>
          <tbody>
            ${lignes.map(({ c, k, caut }) => { const fin = k.budget ? (k.encaisse / k.budget) * 100 : 0; const benef = k.budget - k.charges; return html`
              <tr key=${c.id} class="cliquable" onClick=${() => aller('/chantier/' + c.id)}>
                <td style=${{ minWidth: '190px' }}><div class="fort">${c.numero_marche ? 'N°' + c.numero_marche + ' – ' : ''}${c.intitule}</div><div class="discret">${[c.code, c.lieu].filter(Boolean).join(' · ')}</div></td>
                <td>${c.maitre_ouvrage ?? '—'}</td>
                <td>${dateFr(c.date_marche)}</td>
                <td>${c.delai_jours ? html`<div>${c.delai_jours} jours</div>` : '—'}
                  ${k.joursRestants !== null && html`<span class=${'badge ' + (k.joursRestants < 0 ? 'b-risque' : k.joursRestants <= 30 ? 'b-alerte' : 'b-neutre')}>${k.joursRestants >= 0 ? 'reste ' + k.joursRestants + ' j' : -k.joursRestants + ' j de retard'}</span>`}</td>
                <td class="d fort">${dh(k.budget)}</td>
                <td style=${{ minWidth: '150px' }}><div class="ligne-barre"><${Barre} valeur=${k.avancement} couleur="var(--progres)" /><span style=${{ width: '40px', textAlign: 'right' }}>${Math.round(k.avancement)} %</span></div></td>
                <td style=${{ minWidth: '160px' }}><div class="ligne-barre"><${Barre} valeur=${fin} couleur="var(--accent)" /><span style=${{ width: '40px', textAlign: 'right' }}>${Math.round(fin)} %</span></div><div class="discret">${dh(k.encaisse)} DH</div></td>
                <td class="d">${dh(k.charges)}</td>
                <td>${caut.length ? caut.map(badgeCaution) : html`<span class="badge b-risque">Aucune caution</span>`}</td>
                <td class="d fort" style=${{ color: benef >= 0 ? 'var(--ok)' : 'var(--risque)' }}>${(benef >= 0 ? '+ ' : '− ') + dh(Math.abs(benef))}</td>
              </tr>`; })}
          </tbody>
        </table>
        ${chantiers.loading ? html`<div class="vide">Chargement…</div>` : lignes.length === 0 && html`<div class="vide">Aucun marché pour l'instant. Créez le premier avec « Nouveau marché ».</div>`}
      </div>
    </section>`;
}

  const i = initial;
  async function envoyer(e) {
    const f = lireForm(e);
    setAttente(true);
    await onSave({
      code: String(f.get('code')).trim(), intitule: String(f.get('intitule')).trim(), societe_id: String(f.get('societe_id')),
      maitre_ouvrage: str(f.get('maitre_ouvrage')), numero_marche: str(f.get('numero_marche')), lieu: str(f.get('lieu')),
      montant_marche: num(f.get('montant_marche')), taux_tva: num(f.get('taux_tva')), taux_retenue: num(f.get('taux_retenue')),
      date_os: str(f.get('date_os')), delai_jours: str(f.get('delai_jours')) ? num(f.get('delai_jours')) : null,
      jours_arret: num(f.get('jours_arret')), date_marche: str(f.get('date_marche')),

    });

  return html`
    <form class="formulaire" onSubmit=${envoyer}>

      <${Champ} id="societe_id" label="Société">
        <select id="societe_id" name="societe_id" required key=${societes.rows.length} value=${i.societe_id ?? ''}>
          <option value="" disabled selected=${!i.societe_id}>Choisir…</option>
          ${societes.rows.map((s) => html`<option value=${s.id} selected=${s.id === i.societe_id}>${s.nom}</option>`)}
        </select>
      </${Champ}>
      <${Champ} id="maitre_ouvrage" label="Maître d'ouvrage"><input id="maitre_ouvrage" name="maitre_ouvrage" value=${i.maitre_ouvrage ?? ''} /></${Champ}>
      <${Champ} id="numero_marche" label="N° du marché"><input id="numero_marche" name="numero_marche" value=${i.numero_marche ?? ''} /></${Champ}>
      <${Champ} id="lieu" label="Lieu"><input id="lieu" name="lieu" value=${i.lieu ?? ''} /></${Champ}>
      <${Champ} id="responsable" label="Responsable"><input id="responsable" name="responsable" value=${i.responsable ?? ''} /></${Champ}>
      <${Champ} id="montant_marche" label="Montant du marché TTC (DH)"><input id="montant_marche" name="montant_marche" inputmode="decimal" required value=${i.montant_marche ?? ''} /></${Champ}>
      <${Champ} id="taux_tva" label="TVA (%)"><input id="taux_tva" name="taux_tva" inputmode="decimal" value=${i.taux_tva ?? 20} /></${Champ}>
      <${Champ} id="taux_retenue" label="Retenue de garantie (%)"><input id="taux_retenue" name="taux_retenue" inputmode="decimal" value=${i.taux_retenue ?? 7} /></${Champ}>
      <${Champ} id="statut" label="Statut"><select id="statut" name="statut" value=${i.statut ?? 'Soumission'}>${STATUTS_CHANTIER.map((s) => html`<option value=${s} selected=${s === (i.statut ?? 'Soumission')}>${s}</option>`)}</select></${Champ}>

    ${onglet === 'Caution' && html`<${Cautions} c=${c} rows=${cautions.rows} reload=${cautions.reload} />`}
    ${onglet === 'Avancement' && html`
      <section class="carte"><div class="corps rangee" style=${{ justifyContent: 'space-between' }}>
        <div><div class="fort">Avancement des travaux : ${Math.round(k.avancement)} %</div>
          <div class="discret">${c.avancement_manuel !== null && c.avancement_manuel !== undefined ? 'Saisi à la main.' : 'Calculé à partir du bordereau des prix (ou du planning).'}</div></div>
        <label class="rangee">Saisir à la main :
          <input aria-label="Avancement saisi à la main" inputmode="numeric" placeholder="vide = automatique" style=${{ width: '170px' }} value=${c.avancement_manuel ?? ''}
            onBlur=${async (e) => { const v = str(e.target.value) ? Math.max(0, Math.min(100, num(e.target.value))) : null; if (v !== (c.avancement_manuel ?? null) && await ecrire(sb.from('chantiers').update({ avancement_manuel: v }).eq('id', c.id))) await chantier.reload(); }} /> %</label>
      </div></section>
      <${Bpu} chantierId=${c.id} rows=${bpu.rows} reload=${bpu.reload} />`}
    ${onglet === 'Planning' && html`<${Planning} c=${c} rows=${taches.rows} bpu=${bpu.rows} reload=${taches.reload} />`}
    ${onglet === 'Informations' && html`
      <section class="carte"><div class="corps" style=${{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
        <${ChantierForm} initial=${c} libelle="Enregistrer" onSave=${async (v) => {
          const { error } = await sb.from('chantiers').update(v).eq('id', c.id);
          if (error) return alert('Erreur : ' + error.message);
          await chantier.reload(); setOnglet('Dossier');
        }} />
        <div style=${{ borderTop: '1px solid var(--bord)', paddingTop: '16px' }}>
          <button type="button" class="btn danger" onClick=${async () => {
            if (!confirm('Supprimer ce chantier et toutes ses données (charges, achats, cautions, décomptes, planning) ? Cette action est définitive.')) return;
            const { error } = await sb.from('chantiers').delete().eq('id', c.id);
            if (error) return alert('Erreur : ' + error.message);
            aller('/chantiers');
          }}>Supprimer le chantier</button>
        </div>
      </div></section>`}`;
}

function Dossier({ c, k, depenses, cautions, cats, ouvrir }) {
  const total = (nom) => depenses.filter((d) => d.categorie === nom).reduce((a, d) => a + nb(d.montant_ttc), 0);
  const fin = k.budget ? (k.encaisse / k.budget) * 100 : 0;
  const cautionsActives = cautions.filter((x) => x.statut !== 'Restituée');
  return html`
    <div class="tuiles">
      <${Tuile} l="Montant du marché" v=${dh(k.budget)} s="DH TTC" />
      <div class="tuile"><div class="l">Encaissé</div><div class="v" style=${{ color: 'var(--accent)' }}>${dh(k.encaisse)}</div><div style=${{ marginTop: '8px' }}><${Barre} grande valeur=${fin} couleur="var(--accent)" /></div><div class="s">${Math.round(fin)} % du marché</div></div>
      <${Tuile} l="Total dépensé" v=${dh(k.charges)} s=${'Bénéfice prévu : ' + dh(k.budget - k.charges) + ' DH'} />
      <div class="tuile"><div class="l">Avancement</div><div class="v" style=${{ color: 'var(--progres)' }}>${Math.round(k.avancement)} %</div><div style=${{ marginTop: '8px' }}><${Barre} grande valeur=${k.avancement} couleur="var(--progres)" /></div></div>
      <div class="tuile" style=${{ cursor: 'pointer' }} onClick=${() => ouvrir('Caution')}><div class="l">Caution</div>
        ${cautionsActives.length ? cautionsActives.map((x) => html`<div class="fort" style=${{ marginTop: '6px' }}>${x.type} : ${dh(x.montant)} DH</div>`) : html`<div class="v" style=${{ fontSize: '16px' }}>Aucune</div>`}
        <div class="s">${cautions.filter((x) => x.statut === 'À restituer').length ? 'à récupérer' : cautionsActives.length ? 'déposée' : 'cliquez pour en ajouter'}</div></div>
    </div>
    <div class="dossiers">
      ${cats.liste.map((cat) => { const v = total(cat.nom); return html`
        <button type="button" class=${'dossier' + (v ? '' : ' vide-cat')} onClick=${() => ouvrir('Détail des charges', cat.nom)}>
          <span class="ic">${cat.icone}</span><span class="nom">${cat.nom}</span><span class="discret">${cat.description || ' '}</span>
          <span class="mt">${dh(v)} <small class="discret">DH</small></span>
        </button>`; })}
      <button type="button" class="dossier ajout" onClick=${() => cats.tableOk ? nouvelleCategorie(cats.reload) : alert("Lancez d'abord le fichier migration-v2.sql dans Supabase.")}>+ Nouvelle catégorie</button>
    </div>`;
}

// ---------- Détail des charges (récap par catégorie + détail groupé) ----------
function exporterExcel(nomFichier, feuilles) {
  const wb = XLSX.utils.book_new();
  feuilles.forEach(([nom, lignes]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(lignes), nom.slice(0, 31)));
  XLSX.writeFile(wb, nomFichier.replace(/[\\/:*?"<>|]/g, '-') + '.xlsx');
}

function DetailCharges({ titre, chantierId, rows, fournisseurs, reload, cats, catInitiale }) {
  const [cat, setCat] = useState(catInitiale || 'Toutes');
  const [etat, setEtat] = useState('Tous');
  const [cherche, setCherche] = useState('');
  const [form, setForm] = useState(false);
  const nomF = (id) => fournisseurs.find((f) => f.id === id)?.nom ?? '';
  const q = cherche.trim().toLowerCase();
  const vis = rows.filter((d) => (cat === 'Toutes' || d.categorie === cat) && (etat === 'Tous' || (d.etat ?? 'Sûr') === etat)
    && (!q || (d.libelle + ' ' + nomF(d.fournisseur_id) + ' ' + (d.numero_facture ?? '')).toLowerCase().includes(q)))
    .sort((x, y) => (y.date || '').localeCompare(x.date || '') || (x.numero_facture || '').localeCompare(y.numero_facture || '') || (x.libelle || '').localeCompare(y.libelle || '', 'fr', { numeric: true }));
  const groupes = cats.liste.map((c) => ({ ...c, lignes: vis.filter((d) => d.categorie === c.nom) })).filter((g) => g.lignes.length)
    .map((g) => ({ ...g, total: g.lignes.reduce((a, d) => a + nb(d.montant_ttc), 0) })).sort((a, b) => b.total - a.total);
  const recap = cats.liste.map((c) => { const l = rows.filter((d) => d.categorie === c.nom); return { ...c, n: l.length, total: l.reduce((a, d) => a + nb(d.montant_ttc), 0) }; })
    .filter((g) => g.n).sort((a, b) => b.total - a.total);
  const T = recap.reduce((a, g) => a + g.total, 0), N = recap.reduce((a, g) => a + g.n, 0);
  const totalVis = vis.reduce((a, d) => a + nb(d.montant_ttc), 0);
  const [ouverts, setOuverts] = useState(() => new Set(cat !== 'Toutes' ? [cat] : []));
  const tousOuverts = cat !== 'Toutes' || q || etat !== 'Tous';
  const estOuvert = (nom) => tousOuverts || ouverts.has(nom);
  const basculer = (nom) => { const n = new Set(ouverts); n.has(nom) ? n.delete(nom) : n.add(nom); setOuverts(n); };

  async function ajouter(e) {
    const formEl = e.currentTarget, f = lireForm(e);
    const qte = str(f.get('quantite')) ? num(f.get('quantite')) : null, pu = str(f.get('prix_unitaire')) ? num(f.get('prix_unitaire')) : null;
    const montant = str(f.get('montant_ttc')) ? num(f.get('montant_ttc')) : (qte ?? 0) * (pu ?? 0);
    if (await ecrire(sb.from('depenses').insert({
      chantier_id: chantierId, categorie: String(f.get('categorie')), libelle: String(f.get('libelle')), fournisseur_id: str(f.get('fournisseur_id')),
      numero_facture: str(f.get('numero_facture')), date: String(f.get('date')), quantite: qte, prix_unitaire: pu, montant_ttc: montant,
      montant_paye: f.get('paye') ? montant : 0, etat: String(f.get('etat') || 'Sûr'),
    }))) { formEl.reset(); await reload(); }
  }
  const majEtat = async (d) => { if (await ecrire(sb.from('depenses').update({ etat: (d.etat ?? 'Sûr') === 'Sûr' ? 'À vérifier' : 'Sûr' }).eq('id', d.id))) await reload(); };
  const majCat = async (d, v) => { if (v !== d.categorie && await ecrire(sb.from('depenses').update({ categorie: v }).eq('id', d.id))) await reload(); };
  const excel = () => exporterExcel('Charges ' + titre, [
    ['Récapitulatif', [['Catégorie', 'Lignes', 'Total (DH)', 'Part'], ...recap.map((g) => [g.nom, g.n, g.total, T ? Math.round((g.total / T) * 100) + ' %' : '']), ['TOTAL', N, T, '100 %']]],
    ['Détail', [['Date', 'Catégorie', 'Libellé', 'Fournisseur', 'N° facture', 'Quantité', 'Prix unitaire', 'Montant (DH)', 'Payé (DH)', 'État'],
      ...rows.map((d) => [dateFr(d.date), d.categorie, d.libelle, nomF(d.fournisseur_id), d.numero_facture ?? '', d.quantite ?? '', d.prix_unitaire ?? '', nb(d.montant_ttc), nb(d.montant_paye), d.etat ?? 'Sûr'])]],
  ]);

  return html`
    <div class="entete">
      <div><h2 style=${{ fontSize: '20px' }}>🧾 Détail des charges</h2><div class="sous-titre">${N} charges notées · ${dh(T)} DH · toutes catégories</div></div>
      <div class="rangee no-print">
        <button type="button" class="btn secondaire" onClick=${excel}>⬇️ Excel</button>
        <button type="button" class="btn secondaire" onClick=${() => window.print()}>🖨️ Imprimer</button>
        <button type="button" class="btn" onClick=${() => setForm(!form)}>${form ? 'Fermer' : '+ Ajouter une charge'}</button>
      </div>
    </div>
    ${form && html`<section class="carte no-print"><div class="corps">
      <form class="formulaire" onSubmit=${ajouter}>
        <${Champ} id="e-c" label="Catégorie"><select id="e-c" name="categorie">${cats.liste.map((c) => html`<option value=${c.nom} selected=${c.nom === cat}>${c.icone} ${c.nom}</option>`)}</select></${Champ}>
        <${Champ} id="e-l" label="Libellé" large><input id="e-l" name="libelle" required placeholder="Ex. Gasoil Missour – Talsint" /></${Champ}>
        <${Champ} id="e-d" label="Date"><input id="e-d" name="date" type="date" required value=${today()} /></${Champ}>
        <${Champ} id="e-f" label="Payé à / fournisseur"><select id="e-f" name="fournisseur_id"><option value="">—</option>${fournisseurs.map((f) => html`<option value=${f.id}>${f.nom}</option>`)}</select></${Champ}>
        <${Champ} id="e-q" label="Quantité (facultatif)"><input id="e-q" name="quantite" inputmode="decimal" /></${Champ}>
        <${Champ} id="e-pu" label="Prix unitaire (facultatif)"><input id="e-pu" name="prix_unitaire" inputmode="decimal" /></${Champ}>
        <${Champ} id="e-m" label="Montant (DH)"><input id="e-m" name="montant_ttc" inputmode="decimal" placeholder="vide = quantité × prix" /></${Champ}>
        <${Champ} id="e-n" label="N° facture / bon"><input id="e-n" name="numero_facture" /></${Champ}>
        <${Champ} id="e-et" label="État"><select id="e-et" name="etat">${ETATS.map((x) => html`<option value=${x}>${x}</option>`)}</select></${Champ}>
        <div class="champ"><label style=${{ display: 'flex', gap: '8px', alignItems: 'center', minHeight: '40px' }}><input type="checkbox" name="paye" defaultChecked /> Déjà payé</label></div>
        <div><button class="btn" type="submit">+ Ajouter</button></div>
      </form></div></section>`}
    <div class="cote">
      <section class="carte">
        <div class="tete"><h2>Récapitulatif par catégorie</h2></div>
        <div class="defile"><table class="serre">
          <thead><tr><th>Catégorie</th><th class="d">Lignes</th><th class="d">Total (DH)</th><th>Part</th></tr></thead>
          <tbody>
            ${recap.map((g) => { const p = T ? (g.total / T) * 100 : 0; return html`
              <tr class="cliquable" onClick=${() => setCat(cat === g.nom ? 'Toutes' : g.nom)} style=${cat === g.nom ? { outline: '2px solid var(--accent)' } : null}>
                <td>${g.icone} ${g.nom}</td><td class="d">${g.n}</td><td class="d fort">${dh(g.total)}</td>
                <td style=${{ width: '100px' }}><div class="ligne-barre"><${Barre} valeur=${p} couleur="var(--accent)" /><span style=${{ width: '38px', textAlign: 'right' }}>${Math.round(p)} %</span></div></td>
              </tr>`; })}
            <tr class="total"><td>TOTAL</td><td class="d">${N}</td><td class="d">${dh(T)}</td><td>100 %</td></tr>
          </tbody>
        </table>${recap.length === 0 && html`<div class="vide">Aucune charge pour l'instant.</div>`}</div>
      </section>
      <section class="carte">
        <div class="tete no-print">
          <div class="rangee">
            <select aria-label="Catégorie" style=${{ width: 'auto' }} value=${cat} onChange=${(e) => setCat(e.target.value)}>
              <option value="Toutes" selected=${cat === 'Toutes'}>Catégorie : toutes</option>
              ${cats.liste.map((c) => html`<option value=${c.nom} selected=${c.nom === cat}>${c.icone} ${c.nom}</option>`)}
            </select>
            <select aria-label="État" style=${{ width: 'auto' }} value=${etat} onChange=${(e) => setEtat(e.target.value)}>
              ${['Tous', ...ETATS].map((x) => html`<option value=${x} selected=${x === etat}>${x === 'Tous' ? 'État : tous' : x}</option>`)}
            </select>
            <input type="search" aria-label="Chercher" placeholder="🔍 Chercher" style=${{ width: '200px' }} value=${cherche} onInput=${(e) => setCherche(e.target.value)} />
          </div>
          <span class="discret">${vis.length} ligne(s) · ${dh(totalVis)} DH</span>
        </div>
        <div class="defile"><table style=${{ minWidth: '760px' }}>
          <thead><tr><th>Date</th><th>Libellé</th><th>Payé à / fournisseur</th><th class="d">Montant (DH)</th><th>État</th><th class="no-print"></th></tr></thead>
          <tbody>
            ${groupes.map((g) => html`
              <tr class="groupe" onClick=${() => basculer(g.nom)}><td colspan="3">${estOuvert(g.nom) ? '▾' : '▸'} ${g.icone} ${g.nom} <span class="discret" style=${{ fontWeight: 500 }}>· ${g.lignes.length} ligne(s)</span></td><td class="d">${dh(g.total)}</td><td colspan="2"></td></tr>
              ${estOuvert(g.nom) && g.lignes.map((d) => html`
                <tr key=${d.id}>
                  <td style=${{ whiteSpace: 'nowrap' }}>${dateFr(d.date)}</td>
                  <td style=${{ minWidth: '220px' }}>${d.libelle}${d.quantite ? html`<div class="discret">${d.quantite} × ${dh(d.prix_unitaire)} DH</div>` : ''}</td>
                  <td>${nomF(d.fournisseur_id) || '—'}</td>
                  <td class="d fort">${dh(d.montant_ttc)}${nb(d.montant_ttc) - nb(d.montant_paye) > 0.5 ? html`<div class="discret" style=${{ color: 'var(--alerte)' }}>reste ${dh(nb(d.montant_ttc) - nb(d.montant_paye))}</div>` : ''}</td>
                  <td><button type="button" title="Cliquer pour changer" class=${'badge clic ' + ((d.etat ?? 'Sûr') === 'Sûr' ? 'b-ok' : 'b-alerte')} onClick=${() => majEtat(d)}>${d.etat ?? 'Sûr'}</button></td>

      </section>
    </div>`;
}

function Achats({ chantierId }) {
  const depenses = useTable('depenses', chantierId ? { col: 'chantier_id', val: chantierId } : null, { col: 'date', asc: false });
  const fournisseurs = useTable('fournisseurs', null, { col: 'nom' });
  const chantiers = useTable('chantiers', null, { col: 'intitule' });
  const cheques = useTable('cheques', null, { col: 'date_emission' });
  const cats = useCategories(depenses.rows);
  const [fCh, setFCh] = useState(chantierId || 'Tous');
  const [fFo, setFFo] = useState('Tous');
  const [fCat, setFCat] = useState('Toutes');
  const [cherche, setCherche] = useState('');
  const [form, setForm] = useState(false);
  const nomF = (id) => fournisseurs.rows.find((f) => f.id === id)?.nom ?? '';
  const nomC = (id) => { const c = chantiers.rows.find((x) => x.id === id); return c ? (c.numero_marche ? 'N°' + c.numero_marche + ' ' : '') + c.intitule : ''; };
  const achats = depenses.rows.filter((d) => d.fournisseur_id || d.quantite);
  const q = cherche.trim().toLowerCase();
  const vis = achats.filter((d) => (fCh === 'Tous' || d.chantier_id === fCh) && (fFo === 'Tous' || d.fournisseur_id === fFo) && (fCat === 'Toutes' || d.categorie === fCat) && (!q || d.libelle.toLowerCase().includes(q)))
    .sort((x, y) => (y.date || '').localeCompare(x.date || '') || (x.numero_facture || '').localeCompare(y.numero_facture || '') || (x.libelle || '').localeCompare(y.libelle || '', 'fr', { numeric: true }));
  const situation = fournisseurs.rows.map((f) => {
    const l = achats.filter((d) => d.fournisseur_id === f.id && (fCh === 'Tous' || d.chantier_id === fCh));
    const achete = l.reduce((a, d) => a + nb(d.montant_ttc), 0), paye = l.reduce((a, d) => a + nb(d.montant_paye), 0);
    return { f, achete, reste: achete - paye };
  }).filter((s) => s.achete > 0).sort((a, b) => b.achete - a.achete);
  const tot = situation.reduce((a, s) => ({ achete: a.achete + s.achete, reste: a.reste + s.reste }), { achete: 0, reste: 0 });
  const chequesFo = fFo === 'Tous' ? [] : cheques.rows.filter((x) => x.fournisseur_id === fFo);
  const basculerPaye = async (d) => { const p = nb(d.montant_paye) >= nb(d.montant_ttc) - 0.5 ? 0 : nb(d.montant_ttc); if (await ecrire(sb.from('depenses').update({ montant_paye: p }).eq('id', d.id))) await depenses.reload(); };
  async function ajouter(e) {
    const formEl = e.currentTarget, f = lireForm(e);
    const qte = num(f.get('quantite')), pu = num(f.get('prix_unitaire'));
    const montant = str(f.get('montant_ttc')) ? num(f.get('montant_ttc')) : qte * pu;
    if (await ecrire(sb.from('depenses').insert({
      chantier_id: chantierId || String(f.get('chantier_id')), categorie: String(f.get('categorie')), libelle: String(f.get('libelle')), fournisseur_id: str(f.get('fournisseur_id')),
      numero_facture: str(f.get('numero_facture')), date: String(f.get('date')), quantite: qte, prix_unitaire: pu, montant_ttc: montant, montant_paye: f.get('paye') ? montant : 0, etat: 'Sûr',
    }))) { formEl.reset(); await depenses.reload(); }
  }
  const excel = () => exporterExcel('Achats', [['Achats', [['Date', 'Chantier', 'Fournisseur', 'Produit', 'Catégorie', 'Quantité', 'Prix unitaire', 'Montant (DH)', 'Payé (DH)', 'N° facture'],
    ...vis.map((d) => [dateFr(d.date), nomC(d.chantier_id), nomF(d.fournisseur_id), d.libelle, d.categorie, d.quantite ?? '', d.prix_unitaire ?? '', nb(d.montant_ttc), nb(d.montant_paye), d.numero_facture ?? ''])]]]);

  return html`
    <div class="entete">
      <div>${chantierId ? html`<h2 style=${{ fontSize: '20px' }}>🛒 Achats & produits du chantier</h2>` : html`<h1>🛒 Achats de produits et matières premières</h1>`}

      </div>
    </div>
    ${form && html`<section class="carte"><div class="corps">
      <form class="formulaire" onSubmit=${ajouter}>
        ${!chantierId && html`<${Champ} id="a-ch" label="Chantier"><select id="a-ch" name="chantier_id" required><option value="" disabled selected>Choisir…</option>${chantiers.rows.map((c) => html`<option value=${c.id}>${nomC(c.id)}</option>`)}</select></${Champ}>`}

        <${Champ} id="a-q" label="Quantité"><input id="a-q" name="quantite" inputmode="decimal" required /></${Champ}>
        <${Champ} id="a-pu" label="Prix unitaire (DH)"><input id="a-pu" name="prix_unitaire" inputmode="decimal" required /></${Champ}>
        <${Champ} id="a-m" label="Montant (DH)"><input id="a-m" name="montant_ttc" inputmode="decimal" placeholder="vide = quantité × prix" /></${Champ}>
        <${Champ} id="a-d" label="Date"><input id="a-d" name="date" type="date" required value=${today()} /></${Champ}>
        <${Champ} id="a-n" label="N° facture / bon"><input id="a-n" name="numero_facture" /></${Champ}>
        <div class="champ"><label style=${{ display: 'flex', gap: '8px', alignItems: 'center', minHeight: '40px' }}><input type="checkbox" name="paye" /> Déjà payé</label></div>
        <div><button class="btn" type="submit">+ Ajouter</button></div>

    </div></section>`}
    <div class="cote">
      <section class="carte">

// ---------- BPU ----------
function lireBpu(buffer) {
  const wb = XLSX.read(buffer);
  const lignes = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
  const norm = (v) => String(v ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  const nombre = (v) => typeof v === 'number' ? v : Number(String(v ?? '').replace(/[\s  ]/g, '').replace(',', '.'));
  const iTete = lignes.findIndex((l) => l.some((c) => norm(c).includes('designation')));
  if (iTete < 0) throw new Error('Colonne « Désignation » introuvable dans la première feuille.');
  const tete = lignes[iTete].map(norm);
  const col = (re, sauf = []) => tete.findIndex((h, i) => re.test(h) && !sauf.includes(i));
  const cDes = col(/designation/), cPu = col(/prix unitaire|p\.?\s?u\b|unitaire/);
  const cNum = col(/^n|numero|prix n|^art/, [cDes, cPu]), cUnite = col(/^u$|unite/, [cPu]), cQte = col(/quantite|qte|qt/);
  if (cQte < 0 || cPu < 0) throw new Error('Colonnes « Quantité » et « Prix unitaire » introuvables.');
  const res = [];
  for (const l of lignes.slice(iTete + 1)) {
    const des = String(l[cDes] ?? '').trim(), q = nombre(l[cQte]), pu = nombre(l[cPu]);
    if (!des || !Number.isFinite(q) || !Number.isFinite(pu) || String(l[cQte]).trim() === '' || String(l[cPu]).trim() === '') continue;
    res.push({ numero: cNum >= 0 ? String(l[cNum] ?? '').trim() || null : null, designation: des, unite: cUnite >= 0 ? String(l[cUnite] ?? '').trim() || null : null, quantite: q, prix_unitaire: pu });
  }
  if (!res.length) throw new Error('Aucune ligne de prix reconnue sous l’en-tête.');
  return res;
}

  const fichier = useRef(null);

  const fait = rows.reduce((a, b) => a + Math.min(nb(b.quantite_realisee), nb(b.quantite)) * nb(b.prix_unitaire), 0);
  async function choisir(e) {
    const f = e.target.files?.[0]; e.target.value = '';
    if (!f) return;
    setErreur(null);
    try { setApercu(lireBpu(await f.arrayBuffer())); } catch (err) { setErreur(err.message); }
  }
  async function importer() {
    if (await ecrire(sb.from('articles_bpu').insert(apercu.map((l, i) => ({ ...l, chantier_id: chantierId, ordre: rows.length + i }))))) { setApercu(null); await reload(); }

  }
  async function majRealise(a, v) {
    const q = num(v);
    if (q !== nb(a.quantite_realisee) && await ecrire(sb.from('articles_bpu').update({ quantite_realisee: q }).eq('id', a.id))) await reload();

  return html`

        <div class="discret">La première feuille doit contenir une ligne d'en-tête avec « Désignation », « Quantité » et « Prix unitaire » (et si possible « N° » et « Unité »).</div>
        ${erreur && html`<div class="erreur">${erreur}</div>`}
        ${apercu && html`

          <div class="defile"><table>
            <thead><tr><th>N°</th><th>Désignation</th><th>Unité</th><th class="d">Quantité</th><th class="d">PU HT</th></tr></thead>

          </table></div>

// ---------- Planning (Gantt) ----------
function Planning({ c, rows, bpu, reload }) {
  const fin = dateFinPrevue(c), t = today();
  const dates = [...rows.flatMap((r) => [r.debut, r.fin]), c.date_os, fin, t].filter(Boolean);
  const d0s = dates.reduce((a, b) => (a < b ? a : b), t).slice(0, 8) + '01';
  const fm = new Date(dates.reduce((a, b) => (a > b ? a : b), t) + 'T00:00:00Z'); fm.setUTCMonth(fm.getUTCMonth() + 1, 1);
  const d1s = fm.toISOString().slice(0, 10);
  const d0 = Date.parse(d0s), span = Date.parse(d1s) - d0;
  const pos = (d) => ((Date.parse(d) - d0) / span) * 100;
  const mois = [];
  for (let m = new Date(d0s + 'T00:00:00Z'); m.toISOString().slice(0, 10) < d1s; m.setUTCMonth(m.getUTCMonth() + 1)) {
    const a = m.toISOString().slice(0, 10), n = new Date(m); n.setUTCMonth(n.getUTCMonth() + 1);
    mois.push({ label: MOIS[m.getUTCMonth()] + (m.getUTCMonth() === 0 ? ' ' + m.getUTCFullYear() : ''), l: pos(a), w: pos(n.toISOString().slice(0, 10)) - pos(a) });
  }
  const enRetard = (r) => { const att = Math.max(0, Math.min(100, ((Date.parse(t) - Date.parse(r.debut)) / Math.max(1, Date.parse(r.fin) - Date.parse(r.debut))) * 100)); return nb(r.avancement) < 100 && att - nb(r.avancement) > 15; };
  async function ajouter(e) {
    const form = e.currentTarget, f = lireForm(e);
    if (await ecrire(sb.from('taches').insert({ chantier_id: c.id, nom: String(f.get('nom')), debut: String(f.get('debut')), fin: String(f.get('fin')), avancement: Math.max(0, Math.min(100, num(f.get('avancement')))), ordre: rows.length }))) { form.reset(); await reload(); }
  }
  async function depuisBpu() {
    if (!bpu.length) return alert("Importez d'abord le bordereau des prix.");
    const debut = c.date_os ?? t;
    if (await ecrire(sb.from('taches').insert(bpu.map((a, i) => ({ chantier_id: c.id, nom: (a.numero ? a.numero + ' · ' : '') + a.designation, debut, fin: addDays(debut, 30), avancement: 0, ordre: rows.length + i }))))) await reload();
  }
  return html`
    <div class="entete">
      <div class="discret">OS le ${dateFr(c.date_os)} · délai ${c.delai_jours ?? '—'} jours${nb(c.jours_arret) ? ` + ${c.jours_arret} jours d'arrêt` : ''} · fin contractuelle le ${dateFr(fin)}</div>
      <button type="button" class="btn secondaire" onClick=${depuisBpu}>Créer une tâche par article du BPU</button>
    </div>
    <section class="carte defile" aria-label="Diagramme de Gantt">
      <div class="gantt">
        <div class="rang" style=${{ minHeight: '44px', borderBottom: '1px solid var(--bord)' }}>
          <div class="nom discret fort" style=${{ textTransform: 'uppercase', fontSize: '12px' }}>Tâche</div>
          <div class="piste">${mois.map((m) => html`<div style=${{ position: 'absolute', top: 0, bottom: 0, left: m.l + '%', width: m.w + '%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', fontWeight: 600, color: 'var(--texte-2)' }}>${m.label}</div>`)}</div>
        </div>
        <div class="calque" aria-hidden="true">
          ${mois.map((m) => html`<div style=${{ position: 'absolute', top: 0, bottom: 0, left: m.l + '%', width: '1px', background: 'var(--bord-leger)' }}></div>`)}
          <div title="Aujourd'hui" style=${{ position: 'absolute', top: 0, bottom: 0, left: pos(t) + '%', width: '2px', background: 'var(--accent)' }}></div>
          ${fin && html`<div title="Fin contractuelle" style=${{ position: 'absolute', top: 0, bottom: 0, left: pos(fin) + '%', width: '2px', background: 'var(--risque)' }}></div>`}
        </div>
        ${rows.map((r) => { const late = enRetard(r); return html`
          <div class="rang" key=${r.id}>
            <div class="nom">
              <div class="fort" style=${{ fontSize: '13.5px' }}>${r.nom}</div>
              <div style=${{ display: 'flex', gap: '6px', alignItems: 'center', fontSize: '12px', color: late ? 'var(--risque)' : 'var(--texte-2)' }}>
                ${dateFr(r.debut).slice(0, 5)} → ${dateFr(r.fin).slice(0, 5)} ·
                <input aria-label=${'Avancement ' + r.nom} inputmode="numeric" value=${r.avancement} style=${{ width: '52px', minHeight: '26px', padding: '2px 6px', fontSize: '12px' }} onBlur=${async (e) => { const v = Math.max(0, Math.min(100, num(e.target.value))); if (v !== nb(r.avancement) && await ecrire(sb.from('taches').update({ avancement: v }).eq('id', r.id))) await reload(); }} /> %${late ? ' · en retard' : ''}
                <button type="button" class="btn danger petit" style=${{ minHeight: '24px', padding: '0 6px', marginLeft: 'auto' }} aria-label=${'Supprimer ' + r.nom} onClick=${() => supprimer('taches', r.id, 'Supprimer cette tâche ?', reload)}>×</button>
              </div>
            </div>
            <div class="piste"><div class="bar" style=${{ left: pos(r.debut) + '%', width: Math.max(0.5, pos(r.fin) - pos(r.debut)) + '%', background: late ? '#F4C7C2' : 'var(--progres-clair)' }}><div style=${{ height: '100%', width: nb(r.avancement) + '%', background: 'var(--progres)' }}></div></div></div>
          </div>`; })}
        ${rows.length === 0 && html`<div class="vide">Aucune tâche. Ajoutez-en ci-dessous ou créez-les depuis le BPU.</div>`}
      </div>
    </section>
    <section class="carte">
      <div class="tete"><h2>Ajouter une tâche</h2><span class="discret">Ligne verte : aujourd'hui · ligne rouge : fin contractuelle</span></div>
      <div class="corps">
        <form class="formulaire" onSubmit=${ajouter}>
          <${Champ} id="t-n" label="Tâche" large><input id="t-n" name="nom" required placeholder="Ex. Terrassements" /></${Champ}>
          <${Champ} id="t-d" label="Début"><input id="t-d" name="debut" type="date" required value=${c.date_os ?? t} /></${Champ}>
          <${Champ} id="t-f" label="Fin"><input id="t-f" name="fin" type="date" required /></${Champ}>
          <${Champ} id="t-a" label="Avancement (%)"><input id="t-a" name="avancement" inputmode="numeric" value="0" /></${Champ}>
          <div><button class="btn" type="submit">+ Ajouter</button></div>
        </form>
      </div>
    </section>`;
}

// ---------- Chèques et paiements ----------
function Tresorerie() {
  const cheques = useTable('cheques', null, { col: 'date_echeance', asc: true });
  const fournisseurs = useTable('fournisseurs', null, { col: 'nom' });
  const chantiers = useTable('chantiers', null, { col: 'intitule' });
  const depenses = useTable('depenses');
  const [filtre, setFiltre] = useState('Tous');
  const t = today(), dans7 = addDays(t, 7);
  const emis = cheques.rows.filter((q) => q.statut === 'Émis');
  const proches = emis.filter((q) => q.date_echeance && q.date_echeance <= dans7);
  const du = depenses.rows.reduce((a, d) => a + Math.max(0, nb(d.montant_ttc) - nb(d.montant_paye)), 0);
  const vis = filtre === 'Tous' ? cheques.rows : cheques.rows.filter((q) => q.statut === filtre);
  const nomF = (id) => fournisseurs.rows.find((f) => f.id === id)?.nom;
  const nomC = (id) => chantiers.rows.find((c) => c.id === id)?.intitule ?? '—';
  async function ajouter(e) {
    const form = e.currentTarget, f = lireForm(e);
    const fid = str(f.get('fournisseur_id'));
    if (await ecrire(sb.from('cheques').insert({
      numero: String(f.get('numero')), banque: str(f.get('banque')), fournisseur_id: fid, beneficiaire: str(f.get('beneficiaire')) ?? (fid ? nomF(fid) ?? null : null),
      chantier_id: str(f.get('chantier_id')), montant: num(f.get('montant')), date_emission: String(f.get('date_emission')), date_echeance: str(f.get('date_echeance')),
    }))) { form.reset(); await cheques.reload(); }
  }
  const situation = fournisseurs.rows.map((f) => {
    const deps = depenses.rows.filter((d) => d.fournisseur_id === f.id);
    const facture = deps.reduce((a, d) => a + nb(d.montant_ttc), 0), paye = deps.reduce((a, d) => a + nb(d.montant_paye), 0);
    return { f, facture, paye, reste: facture - paye, enCours: emis.filter((q) => q.fournisseur_id === f.id).reduce((a, q) => a + nb(q.montant), 0) };
  }).filter((s) => s.facture > 0 || s.enCours > 0).sort((a, b) => b.reste - a.reste);
  return html`
    <div class="entete"><h1>Chèques et paiements</h1></div>
    ${cheques.error && html`<div class="erreur">${cheques.error}</div>`}
    <div class="tuiles">
      <${Tuile} l="Chèques émis non encaissés" v=${dh(emis.reduce((a, q) => a + nb(q.montant), 0))} s=${emis.length + ' chèque(s)'} />
      <${Tuile} l="À provisionner sous 7 jours" v=${dh(proches.reduce((a, q) => a + nb(q.montant), 0))} couleur=${proches.length ? 'var(--alerte)' : null} s=${proches.length + " chèque(s), jusqu'au " + dateFr(dans7).slice(0, 5)} />
      <${Tuile} l="Dû aux fournisseurs" v=${dh(du)} s="factures non réglées, tous chantiers" />
    </div>
    <section class="carte">
      <div class="tete"><h2>Enregistrer un chèque</h2></div>
      <div class="corps">
        <form class="formulaire" onSubmit=${ajouter}>
          <${Champ} id="q-n" label="N° du chèque"><input id="q-n" name="numero" required /></${Champ}>
          <${Champ} id="q-b" label="Banque"><input id="q-b" name="banque" /></${Champ}>
          <${Champ} id="q-f" label="Fournisseur"><select id="q-f" name="fournisseur_id"><option value="">—</option>${fournisseurs.rows.map((f) => html`<option value=${f.id}>${f.nom}</option>`)}</select></${Champ}>
          <${Champ} id="q-be" label="Autre bénéficiaire"><input id="q-be" name="beneficiaire" placeholder="si pas dans la liste" /></${Champ}>
          <${Champ} id="q-c" label="Chantier"><select id="q-c" name="chantier_id"><option value="">—</option>${chantiers.rows.map((c) => html`<option value=${c.id}>${c.intitule}</option>`)}</select></${Champ}>
          <${Champ} id="q-m" label="Montant (DH)"><input id="q-m" name="montant" inputmode="decimal" required /></${Champ}>
          <${Champ} id="q-de" label="Émis le"><input id="q-de" name="date_emission" type="date" required value=${t} /></${Champ}>
          <${Champ} id="q-ech" label="Échéance"><input id="q-ech" name="date_echeance" type="date" /></${Champ}>
          <div><button class="btn" type="submit">+ Enregistrer</button></div>
        </form>
      </div>
    </section>
    <section class="carte">
      <div class="tete"><h2>Registre des chèques</h2>
        <div class="rangee" role="group" aria-label="Filtrer par statut">${['Tous', ...STATUTS_CHEQUE].map((s) => html`<button type="button" class="pilule" aria-pressed=${String(filtre === s)} onClick=${() => setFiltre(s)}>${s}</button>`)}</div>
      </div>
      <div class="defile">
        <table style=${{ minWidth: '960px' }}>
          <thead><tr><th>N° chèque</th><th>Bénéficiaire</th><th>Chantier</th><th>Banque</th><th>Émis le</th><th>Échéance</th><th class="d">Montant (DH)</th><th>Statut</th><th></th></tr></thead>
          <tbody>${vis.map((q) => { const proche = q.statut === 'Émis' && q.date_echeance && q.date_echeance <= dans7; return html`
            <tr key=${q.id}>
              <td class="fort">${q.numero}</td><td>${q.beneficiaire ?? nomF(q.fournisseur_id) ?? '—'}</td><td>${nomC(q.chantier_id)}</td><td>${q.banque}</td><td>${dateFr(q.date_emission)}</td>
              <td style=${proche ? { color: 'var(--alerte)', fontWeight: 600 } : null}>${dateFr(q.date_echeance)}${proche ? (q.date_echeance < t ? ' · dépassée' : ' · cette semaine') : ''}</td>
              <td class="d fort">${dh(q.montant)}</td>
              <td style=${{ width: '140px' }}><select aria-label=${'Statut chèque ' + q.numero} value=${q.statut} onChange=${async (e) => { if (await ecrire(sb.from('cheques').update({ statut: e.target.value }).eq('id', q.id))) await cheques.reload(); }}>${STATUTS_CHEQUE.map((s) => html`<option value=${s} selected=${s === q.statut}>${s}</option>`)}</select></td>
              <td><${BtnSuppr} label=${'chèque ' + q.numero} onClick=${() => supprimer('cheques', q.id, 'Supprimer ce chèque ?', cheques.reload)} /></td>
            </tr>`; })}</tbody>
        </table>
        ${vis.length === 0 && html`<div class="vide">Aucun chèque.</div>`}
      </div>
    </section>
    <section class="carte">
      <div class="tete"><h2>Situation des fournisseurs</h2></div>
      <div class="defile">
        <table style=${{ minWidth: '720px' }}>
          <thead><tr><th>Fournisseur</th><th>Catégorie</th><th class="d">Facturé (DH)</th><th class="d">Payé (DH)</th><th class="d">Reste dû (DH)</th><th class="d">Chèques en circulation</th></tr></thead>
          <tbody>${situation.map((s) => html`<tr><td class="fort">${s.f.nom}</td><td>${s.f.categorie}</td><td class="d">${dh(s.facture)}</td><td class="d">${dh(s.paye)}</td><td class="d fort">${dh(s.reste)}</td><td class="d">${dh(s.enCours)}</td></tr>`)}</tbody>
        </table>
        ${situation.length === 0 && html`<div class="vide">Aucune facture fournisseur enregistrée.</div>`}
      </div>
    </section>`;
}

// ---------- Fournisseurs ----------
function Fournisseurs() {
  const f = useTable('fournisseurs', null, { col: 'nom' });
  async function ajouter(e) {
    const form = e.currentTarget, d = lireForm(e);
    if (await ecrire(sb.from('fournisseurs').insert({ nom: String(d.get('nom')), categorie: str(d.get('categorie')), ice: str(d.get('ice')), rib: str(d.get('rib')), telephone: str(d.get('telephone')) }))) { form.reset(); await f.reload(); }
  }
  return html`
    <div class="entete"><h1>Fournisseurs et sous-traitants</h1></div>
    <section class="carte">
      <div class="tete"><h2>Ajouter un fournisseur</h2></div>
      <div class="corps">
        <form class="formulaire" onSubmit=${ajouter}>
          <${Champ} id="f-n" label="Raison sociale"><input id="f-n" name="nom" required /></${Champ}>
          <${Champ} id="f-c" label="Catégorie"><input id="f-c" name="categorie" placeholder="Ciment, fer, transport…" /></${Champ}>
          <${Champ} id="f-i" label="ICE"><input id="f-i" name="ice" /></${Champ}>
          <${Champ} id="f-r" label="RIB"><input id="f-r" name="rib" /></${Champ}>
          <${Champ} id="f-t" label="Téléphone"><input id="f-t" name="telephone" type="tel" /></${Champ}>
          <div><button class="btn" type="submit">+ Ajouter</button></div>
        </form>
      </div>
    </section>
    <section class="carte">
      <div class="defile">
        <table style=${{ minWidth: '700px' }}>
          <thead><tr><th>Raison sociale</th><th>Catégorie</th><th>ICE</th><th>RIB</th><th>Téléphone</th><th></th></tr></thead>
          <tbody>${f.rows.map((x) => html`<tr key=${x.id}><td class="fort">${x.nom}</td><td>${x.categorie}</td><td>${x.ice}</td><td class="discret">${x.rib}</td><td>${x.telephone}</td>
            <td><${BtnSuppr} label=${x.nom} onClick=${() => supprimer('fournisseurs', x.id, 'Supprimer ce fournisseur ?', f.reload)} /></td></tr>`)}</tbody>
        </table>
        ${f.rows.length === 0 && !f.loading && html`<div class="vide">Aucun fournisseur.</div>`}
      </div>
    </section>`;
}

// ---------- Application ----------
function App() {
  const route = useRoute();
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    if (!CONFIG_OK) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (!CONFIG_OK) return html`<div class="contenu"><div class="erreur">Supabase n'est pas configuré. Ouvrez index.html sur GitHub (icône crayon) et remplacez, en haut du fichier, VOTRE-PROJET et VOTRE-CLE-PUBLIQUE par les valeurs de Supabase › Project Settings › API.</div></div>`;
  if (session === undefined) return html`<div class="contenu discret">Chargement…</div>`;
  if (!session) return html`<${Login} />`;
  let page;
  if (route.startsWith('/chantier/')) page = html`<${Fiche} key=${route} id=${route.slice('/chantier/'.length)} />`;
  else if (route === '/chantiers') page = html`<${ListeChantiers} />`;
  else if (route === '/achats') page = html`<${Achats} key="tous" />`;
  else if (route === '/cautions') page = html`<${ToutesCautions} />`;
  else if (route === '/nouveau') page = html`<${NouveauChantier} />`;
  else if (route === '/tresorerie') page = html`<${Tresorerie} />`;
  else if (route === '/fournisseurs') page = html`<${Fournisseurs} />`;
  else page = html`<${TableauDeBord} />`;
  return html`<${Cadre} route=${route} email=${(session.user.email || '').replace(DOMAINE_COMPTES, '')}>${page}</${Cadre}>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
