<script type="module">
import { html, render, useState, useEffect, useCallback, useMemo, useRef } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js';

// ---------- Connexion à Supabase ----------
const CONFIG_OK = !/VOTRE-PROJET|VOTRE-CLE/.test(window.SUPABASE_URL + window.SUPABASE_ANON_KEY);
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// ---------- Listes ----------
const STATUTS_CHANTIER = ['Soumission', 'Attribué', 'En cours', 'Arrêté', 'Réception provisoire', 'Clôturé'];
const TYPES_CAUTION = ['Provisoire', 'Définitive', 'Retenue de garantie', 'Avance'];
const STATUTS_CAUTION = ['Active', 'À restituer', 'Restituée'];
const CATEGORIES_DEPENSE = ['Achats matériaux', "Main d'œuvre", 'Transport', 'Sous-traitance', 'Location engins', 'Dépenses diverses'];
const STATUTS_CHEQUE = ['Émis', 'Encaissé', 'Rejeté', 'Annulé'];
const MOIS = ['Janv', 'Févr', 'Mars', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sept', 'Oct', 'Nov', 'Déc'];

// ---------- Format ----------
const dh = (n) => Math.round(Number(n ?? 0)).toLocaleString('fr-FR');
const mdh = (n) => (n / 1e6).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' M';
const dateFr = (d) => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}` : '—';
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const num = (v) => { const n = Number(String(v ?? '').replace(/[\s  ]/g, '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const str = (v) => { const s = String(v ?? '').trim(); return s === '' ? null : s; };
const nb = (x) => Number(x ?? 0);

// ---------- Calculs ----------
function avancementPhysique(bpu, taches) {
  const total = bpu.reduce((a, b) => a + nb(b.quantite) * nb(b.prix_unitaire), 0);
  if (total > 0) return (bpu.reduce((a, b) => a + Math.min(nb(b.quantite_realisee), nb(b.quantite)) * nb(b.prix_unitaire), 0) / total) * 100;
  if (taches.length) return taches.reduce((a, t) => a + nb(t.avancement), 0) / taches.length;
  return 0;
}
const dateFinPrevue = (c) => (c.date_os && c.delai_jours ? addDays(c.date_os, nb(c.delai_jours) + nb(c.jours_arret)) : null);

function indicateurs(c, d) {
  const budget = nb(c.montant_marche);
  const facture = d.decomptes.reduce((a, x) => a + nb(x.montant_ttc), 0);
  const retenue = nb(c.taux_retenue) / 100;
  const encaisse = d.decomptes.filter((x) => x.encaisse).reduce((a, x) => a + nb(x.montant_ttc) * (1 - retenue), 0);
  const fraisCautions = d.cautions.reduce((a, x) => a + nb(x.frais), 0);
  const charges = d.depenses.reduce((a, x) => a + nb(x.montant_ttc), 0) + fraisCautions;
  const paye = d.depenses.reduce((a, x) => a + nb(x.montant_paye), 0) + fraisCautions;
  const avancement = avancementPhysique(d.bpu, d.taches);
  const consommation = budget > 0 ? (charges / budget) * 100 : 0;
  const dateFin = dateFinPrevue(c);
  let delaiEcoulePct = null, joursRestants = null;
  const enCours = c.statut === 'En cours' || c.statut === 'Arrêté';
  if (c.date_os && c.delai_jours && enCours) {
    const ecoule = Math.max(0, daysBetween(c.date_os, today()) - nb(c.jours_arret));
    delaiEcoulePct = (ecoule / nb(c.delai_jours)) * 100;
    joursRestants = nb(c.delai_jours) - ecoule;
  }
  const raisons = [];
  if (enCours && consommation > avancement + 10) raisons.push(`${Math.round(consommation)} % du budget consommé pour ${Math.round(avancement)} % des travaux`);
  if (delaiEcoulePct !== null && delaiEcoulePct > avancement + 10) raisons.push(`${Math.round(delaiEcoulePct)} % du délai écoulé pour ${Math.round(avancement)} % des travaux`);
  if (joursRestants !== null && joursRestants < 0) raisons.push(`délai dépassé de ${-joursRestants} jours`);
  return {
    budget, facture, encaisse, resteAFacturer: budget - facture, charges, paye, marge: facture - charges,
    margePct: facture > 0 ? ((facture - charges) / facture) * 100 : null, consommation, avancement,
    delaiEcoulePct, joursRestants, dateFin,
    cautionsActives: d.cautions.filter((x) => x.statut !== 'Restituée').reduce((a, x) => a + nb(x.montant), 0),
    tachesRestantes: d.taches.filter((t) => nb(t.avancement) < 100).length, tachesTotal: d.taches.length,
    aRisque: raisons.length > 0, raisons,
  };
}

// ---------- Accès aux données ----------
function useTable(table, filtre, ordre) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const fcol = filtre?.col, fval = filtre?.val, ocol = ordre?.col, oasc = ordre?.asc ?? true;
  const reload = useCallback(async () => {
    let q = sb.from(table).select('*');
    if (fcol && fval) q = q.eq(fcol, fval);
    if (ocol) q = q.order(ocol, { ascending: oasc });
    const { data, error } = await q;
    setError(error ? error.message : null);
    setRows(data ?? []);
    setLoading(false);
  }, [table, fcol, fval, ocol, oasc]);
  useEffect(() => { reload(); }, [reload]);
  return { rows, loading, error, reload };
}
async function ecrire(p) {
  const { error } = await p;
  if (error) { alert('Erreur : ' + error.message); return false; }
  return true;
}
const supprimer = async (table, id, question, reload) => {
  if (confirm(question) && await ecrire(sb.from(table).delete().eq('id', id))) await reload();
};

// ---------- Navigation (adresse après #) ----------
function useRoute() {
  const [h, setH] = useState(location.hash.slice(1) || '/');
  useEffect(() => { const f = () => setH(location.hash.slice(1) || '/'); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  return h;
}
const aller = (r) => { location.hash = r; };

// ---------- Petits composants ----------
const CLS = { 'Soumission': 'b-neutre', 'Attribué': 'b-alerte', 'En cours': 'b-info', 'Arrêté': 'b-alerte', 'Réception provisoire': 'b-ok', 'Clôturé': 'b-neutre', 'Active': 'b-info', 'À restituer': 'b-alerte', 'Restituée': 'b-ok', 'Émis': 'b-info', 'Encaissé': 'b-ok', 'Rejeté': 'b-risque', 'Annulé': 'b-neutre' };
const Badge = ({ statut, risque }) => risque ? html`<span class="badge b-risque">À risque</span>` : html`<span class=${'badge ' + (CLS[statut] ?? 'b-neutre')}>${statut}</span>`;
const Barre = ({ valeur, couleur, grande }) => html`<div class=${'barre' + (grande ? ' grande' : '')}><div style=${{ width: Math.max(0, Math.min(100, valeur)) + '%', background: couleur }}></div></div>`;
const Tuile = ({ l, v, s, couleur }) => html`<div class="tuile"><div class="l">${l}</div><div class="v" style=${couleur ? { color: couleur } : null}>${v}</div><div class="s">${s}</div></div>`;
const BtnSuppr = ({ onClick, label }) => html`<button type="button" class="btn danger petit" aria-label=${'Supprimer ' + label} onClick=${onClick}>×</button>`;
const Champ = ({ id, label, large, children }) => html`<div class=${'champ' + (large ? ' large' : '')}><label for=${id}>${label}</label>${children}</div>`;
const lireForm = (e) => { e.preventDefault(); return new FormData(e.currentTarget); };

// ---------- Connexion ----------
function Login() {
  const [mode, setMode] = useState('connexion');
  const [erreur, setErreur] = useState(null);
  const [info, setInfo] = useState(null);
  const [attente, setAttente] = useState(false);
  async function envoyer(e) {
    const f = lireForm(e);
    setErreur(null); setInfo(null); setAttente(true);
    const email = String(f.get('email')), password = String(f.get('password'));
    const res = mode === 'connexion' ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
    setAttente(false);
    if (res.error) return setErreur(res.error.message);
    if (mode === 'inscription' && !res.data.session) setInfo('Compte créé. Confirmez votre adresse via l’email reçu, puis connectez-vous.');
  }
  return html`
    <div style=${{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: '16px' }}>
      <div class="carte" style=${{ width: '100%', maxWidth: '400px' }}>
        <div class="corps" style=${{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
          <h1 style=${{ fontSize: '22px' }}>${mode === 'connexion' ? 'Connexion' : 'Créer un compte'}</h1>
          <div class="discret">Gestion de chantiers Cédil & ADPAP</div>
          ${erreur && html`<div class="erreur">${erreur}</div>`}
          ${info && html`<div class="note">${info}</div>`}
          <form onSubmit=${envoyer} style=${{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
            <${Champ} id="email" label="Email"><input id="email" name="email" type="email" required autocomplete="email" /></${Champ}>
            <${Champ} id="password" label="Mot de passe"><input id="password" name="password" type="password" required minlength="6" /></${Champ}>
            <button class="btn" type="submit" disabled=${attente} style=${{ justifyContent: 'center' }}>${attente ? 'Patientez…' : mode === 'connexion' ? 'Se connecter' : 'Créer le compte'}</button>
          </form>
          <button type="button" class="btn secondaire" style=${{ justifyContent: 'center' }} onClick=${() => setMode(mode === 'connexion' ? 'inscription' : 'connexion')}>
            ${mode === 'connexion' ? 'Pas encore de compte ? Créer un compte' : 'Déjà un compte ? Se connecter'}
          </button>
        </div>
      </div>
    </div>`;
}

// ---------- Cadre (menu) ----------
function Cadre({ route, email, children }) {
  const liens = [['/', 'Tableau de bord'], ['/nouveau', 'Nouveau chantier'], ['/tresorerie', 'Chèques et paiements'], ['/fournisseurs', 'Fournisseurs']];
  const actif = (r) => r === '/' ? (route === '/' || route.startsWith('/chantier/')) : route === r;
  return html`
    <div class="app">
      <nav class="menu" aria-label="Menu principal">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h20"/><path d="M5 20V9l7-5 7 5v11"/><path d="M9 20v-6h6v6"/></svg>
          Chantiers
        </div>
        ${liens.map(([r, l]) => html`<a href=${'#' + r} class=${actif(r) ? 'actif' : ''}>${l}</a>`)}
        <div class="bas">
          <span>${email}</span>
          <button class="btn secondaire petit" type="button" onClick=${() => sb.auth.signOut()}>Se déconnecter</button>
        </div>
      </nav>
      <main class="contenu">${children}</main>
    </div>`;
}

// ---------- Tableau de bord ----------
function TableauDeBord() {
  const societes = useTable('societes', null, { col: 'nom' });
  const chantiers = useTable('chantiers', null, { col: 'created_at', asc: false });
  const cautions = useTable('cautions');
  const bpu = useTable('articles_bpu');
  const decomptes = useTable('decomptes');
  const depenses = useTable('depenses');
  const taches = useTable('taches');
  const cheques = useTable('cheques');
  const [filtre, setFiltre] = useState('toutes');

  const lignes = useMemo(() => {
    const par = (rows, id) => rows.filter((r) => r.chantier_id === id);
    return chantiers.rows.filter((c) => filtre === 'toutes' || c.societe_id === filtre).map((c) => ({
      c, k: indicateurs(c, { cautions: par(cautions.rows, c.id), bpu: par(bpu.rows, c.id), decomptes: par(decomptes.rows, c.id), depenses: par(depenses.rows, c.id), taches: par(taches.rows, c.id) }),
    }));
  }, [chantiers.rows, cautions.rows, bpu.rows, decomptes.rows, depenses.rows, taches.rows, filtre]);

  const ids = new Set(lignes.map((l) => l.c.id));
  const somme = (f) => lignes.reduce((a, l) => a + f(l.k), 0);
  const budget = somme((k) => k.budget), charges = somme((k) => k.charges), facture = somme((k) => k.facture);
  const actifs = lignes.filter((l) => !['Clôturé', 'Réception provisoire'].includes(l.c.statut)).length;
  const nomSociete = (id) => societes.rows.find((s) => s.id === id)?.nom ?? '';
  const intitule = (id) => chantiers.rows.find((c) => c.id === id)?.intitule ?? '';

  const t = today(), dans7 = addDays(t, 7), dans30 = addDays(t, 30);
  const alertes = [];
  lignes.forEach((l) => l.k.raisons.forEach((r) => alertes.push({ texte: `${l.c.intitule} : ${r}.`, grave: true })));
  cautions.rows.filter((x) => ids.has(x.chantier_id) && x.statut !== 'Restituée' && x.date_echeance && x.date_echeance <= dans30)
    .forEach((x) => alertes.push({ texte: `Caution ${x.type.toLowerCase()} ${intitule(x.chantier_id)} : échéance le ${dateFr(x.date_echeance)}.` }));
  cautions.rows.filter((x) => ids.has(x.chantier_id) && x.statut === 'À restituer')
    .forEach((x) => alertes.push({ texte: `Caution ${x.type.toLowerCase()} ${intitule(x.chantier_id)} à récupérer auprès du maître d'ouvrage.` }));
  const aProv = cheques.rows.filter((q) => q.statut === 'Émis' && q.date_echeance && q.date_echeance <= dans7);
  if (aProv.length) alertes.push({ texte: `${aProv.length} chèque(s) à échéance sous 7 jours : ${dh(aProv.reduce((a, q) => a + nb(q.montant), 0))} DH à provisionner.` });

  const ech = [];
  cheques.rows.filter((q) => q.statut === 'Émis' && q.date_echeance && q.date_echeance >= addDays(t, -30))
    .forEach((q) => ech.push({ date: q.date_echeance, texte: `Chèque n° ${q.numero}${q.beneficiaire ? ' · ' + q.beneficiaire : ''}`, detail: dh(q.montant) + ' DH' }));
  cautions.rows.filter((x) => ids.has(x.chantier_id) && x.statut !== 'Restituée' && x.date_echeance && x.date_echeance >= t)
    .forEach((x) => ech.push({ date: x.date_echeance, texte: `Caution ${x.type.toLowerCase()} · ${intitule(x.chantier_id)}`, detail: 'expire' }));
  lignes.filter((l) => l.c.statut === 'En cours' && l.k.dateFin && daysBetween(t, l.k.dateFin) <= 60)
    .forEach((l) => ech.push({ date: l.k.dateFin, texte: `Fin contractuelle · ${l.c.intitule}`, detail: '' }));
  ech.sort((a, b) => a.date.localeCompare(b.date));

  return html`
    <div class="entete">
      <div>
        <div class="discret">${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
        <h1 style=${{ marginTop: '4px' }}>Tableau de bord des chantiers</h1>
      </div>
      <div class="rangee" role="group" aria-label="Filtrer par société">
        <button type="button" class="pilule" aria-pressed=${String(filtre === 'toutes')} onClick=${() => setFiltre('toutes')}>Toutes</button>
        ${societes.rows.map((s) => html`<button key=${s.id} type="button" class="pilule" aria-pressed=${String(filtre === s.id)} onClick=${() => setFiltre(s.id)}>${s.nom}</button>`)}
      </div>
    </div>
    ${(chantiers.error || societes.error) && html`<div class="erreur">Impossible de lire la base : ${chantiers.error || societes.error}. Avez-vous exécuté le fichier SQL dans Supabase ?</div>`}
    <div class="tuiles">
      <${Tuile} l="Chantiers actifs" v=${actifs} s=${lignes.filter((l) => l.k.aRisque).length + ' à risque'} />
      <${Tuile} l="Budget total des marchés" v=${mdh(budget)} s="DH TTC" />
      <${Tuile} l="Charges engagées" v=${mdh(charges)} s=${(budget ? Math.round((charges / budget) * 100) : 0) + ' % du budget'} />
      <${Tuile} l="Facturé au maître d'ouvrage" v=${mdh(facture)} s=${'Reste à facturer : ' + mdh(budget - facture) + ' DH'} />
      <${Tuile} l="Cautions immobilisées" v=${dh(somme((k) => k.cautionsActives))} s="DH, toutes banques" />
    </div>
    <section class="carte">
      <div class="tete"><h2>Tous les chantiers</h2><a href="#/nouveau" class="btn">+ Nouveau chantier</a></div>
      <div class="defile">
        <table style=${{ minWidth: '1040px' }}>
          <thead><tr><th>Chantier</th><th>Société</th><th class="d">Budget (DH)</th><th class="d">Charges (DH)</th><th style=${{ width: '210px' }}>Avancement / budget</th><th>Délai</th><th class="d">Tâches</th><th>Statut</th></tr></thead>
          <tbody>
            ${lignes.map(({ c, k }) => html`
              <tr key=${c.id}>
                <td><a href=${'#/chantier/' + c.id} class="fort" style=${{ color: 'var(--texte)', textDecoration: 'none' }}>${c.intitule}</a><div class="discret">${c.code}${c.maitre_ouvrage ? ' · ' + c.maitre_ouvrage : ''}</div></td>
                <td>${nomSociete(c.societe_id)}</td>
                <td class="d">${dh(k.budget)}</td>
                <td class="d">${dh(k.charges)}</td>
                <td>
                  <div class="ligne-barre"><span>Travaux ${Math.round(k.avancement)} %</span><${Barre} valeur=${k.avancement} couleur="var(--progres)" /></div>
                  <div class="ligne-barre"><span>Budget ${Math.round(k.consommation)} %</span><${Barre} valeur=${k.consommation} couleur=${k.consommation > k.avancement + 10 ? 'var(--risque)' : 'var(--accent)'} /></div>
                </td>
                <td>${k.joursRestants !== null ? html`
                  <div class="fort" style=${{ color: (k.delaiEcoulePct ?? 0) > k.avancement + 10 ? 'var(--risque)' : null }}>${k.joursRestants >= 0 ? k.joursRestants + ' j restants' : -k.joursRestants + ' j de retard'}</div>
                  <div class="discret">${Math.round(k.delaiEcoulePct)} % du délai écoulé</div>` : html`
                  <div class="fort">${c.delai_jours ? c.delai_jours + ' jours' : '—'}</div>
                  <div class="discret">${c.date_os ? 'Fin : ' + dateFr(k.dateFin) : "Démarre à l'ordre de service"}</div>`}
                </td>
                <td class="d">${k.tachesTotal ? `${k.tachesTotal - k.tachesRestantes} / ${k.tachesTotal}` : '—'}</td>
                <td><${Badge} statut=${c.statut} risque=${k.aRisque} /></td>
              </tr>`)}
          </tbody>
        </table>
        ${chantiers.loading ? html`<div class="vide">Chargement…</div>` : lignes.length === 0 && html`<div class="vide">Aucun chantier pour l'instant. Créez le premier avec « Nouveau chantier ».</div>`}
      </div>
    </section>
    <div class="grille2">
      <section class="carte">
        <div class="tete"><h2>Alertes</h2></div>
        <div class="corps">${alertes.length === 0 ? html`<div class="discret">Aucune alerte.</div>` : html`
          <ul class="alertes">${alertes.map((a) => html`<li><span class="point" style=${{ background: a.grave ? 'var(--risque)' : '#C27A00' }}></span><span>${a.texte}</span></li>`)}</ul>`}
        </div>
      </section>

        <div class="tete"><h2>Prochaines échéances</h2><a href="#/tresorerie" class="discret">Voir les chèques</a></div>
        <div class="corps">${ech.length === 0 ? html`<div class="discret">Rien de prévu.</div>` :
          ech.slice(0, 8).map((i) => html`<div class="ligne-liste"><span>${i.texte}</span><span class="discret" style=${{ whiteSpace: 'nowrap' }}>${dateFr(i.date).slice(0, 5)}${i.detail ? ' · ' + i.detail : ''}</span></div>`)}
        </div>
      </section>
    </div>`;
}

const ONGLETS = ['Synthèse', 'BPU et avancement', 'Décomptes', 'Dépenses', 'Cautions', 'Planning', 'Informations'];

function Fiche({ id }) {
  const [onglet, setOnglet] = useState('Synthèse');
  const par = { col: 'chantier_id', val: id };
  const chantier = useTable('chantiers', { col: 'id', val: id });
  const societes = useTable('societes');
  const fournisseurs = useTable('fournisseurs', null, { col: 'nom' });
  const cautions = useTable('cautions', par, { col: 'date_emission' });
  const bpu = useTable('articles_bpu', par, { col: 'ordre' });
  const decomptes = useTable('decomptes', par, { col: 'numero' });
  const depenses = useTable('depenses', par, { col: 'date', asc: false });
  const taches = useTable('taches', par, { col: 'debut' });
  const c = chantier.rows[0];
  if (chantier.loading) return html`<div class="discret">Chargement…</div>`;
  if (!c) return html`<div class="erreur">Chantier introuvable. <a href="#/">Retour au tableau de bord</a></div>`;
  const k = indicateurs(c, { cautions: cautions.rows, bpu: bpu.rows, decomptes: decomptes.rows, depenses: depenses.rows, taches: taches.rows });
  const societe = societes.rows.find((s) => s.id === c.societe_id)?.nom;
  return html`
    <div style=${{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
      <a href="#/" style=${{ fontSize: '13px', textDecoration: 'none' }}>← Tous les chantiers</a>
      <div class="rangee" style=${{ gap: '10px' }}><h1>${c.intitule}</h1><${Badge} statut=${c.statut} />${k.aRisque && html`<span class="badge b-risque">À risque</span>`}</div>
      <div class="sous-titre" style=${{ marginTop: 0 }}>${[c.code, c.numero_marche && 'Marché n° ' + c.numero_marche, societe, c.maitre_ouvrage && "Maître d'ouvrage : " + c.maitre_ouvrage].filter(Boolean).join(' · ')}</div>
    </div>
    <div class="onglets" role="tablist">
      ${ONGLETS.map((o) => html`<button type="button" role="tab" aria-selected=${String(onglet === o)} onClick=${() => setOnglet(o)}>${o}</button>`)}
    </div>
    ${onglet === 'Synthèse' && html`<${Synthese} c=${c} k=${k} depenses=${depenses.rows} cautions=${cautions.rows} />`}
    ${onglet === 'BPU et avancement' && html`<${Bpu} chantierId=${c.id} rows=${bpu.rows} reload=${bpu.reload} />`}
    ${onglet === 'Décomptes' && html`<${Decomptes} c=${c} rows=${decomptes.rows} reload=${decomptes.reload} />`}
    ${onglet === 'Dépenses' && html`<${Depenses} chantierId=${c.id} rows=${depenses.rows} fournisseurs=${fournisseurs.rows} reload=${depenses.reload} />`}
    ${onglet === 'Cautions' && html`<${Cautions} c=${c} rows=${cautions.rows} reload=${cautions.reload} />`}
    ${onglet === 'Planning' && html`<${Planning} c=${c} rows=${taches.rows} bpu=${bpu.rows} reload=${taches.reload} />`}
    ${onglet === 'Informations' && html`
      <section class="carte"><div class="corps" style=${{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
        <${ChantierForm} initial=${c} libelle="Enregistrer" onSave=${async (v) => {
          const { error } = await sb.from('chantiers').update(v).eq('id', c.id);
          if (error) return alert('Erreur : ' + error.message);
          await chantier.reload(); setOnglet('Synthèse');
        }} />
        <div style=${{ borderTop: '1px solid var(--bord)', paddingTop: '16px' }}>
          <button type="button" class="btn danger" onClick=${async () => {
            if (!confirm('Supprimer ce chantier et toutes ses données (BPU, dépenses, cautions, décomptes, planning) ? Cette action est définitive.')) return;
            const { error } = await sb.from('chantiers').delete().eq('id', c.id);
            if (error) return alert('Erreur : ' + error.message);
            aller('/');
          }}>Supprimer le chantier</button>
        </div>
      </div></section>`}`;
}

      <${Tuile} l="Reste à faire" v=${dh(k.resteAFacturer)} s=${'DH à facturer' + (k.tachesTotal ? ' · ' + k.tachesRestantes + ' tâches' : '')} />

    <div class="grille2">
      <section class="carte">
        <div class="tete"><h2>Délai d'exécution</h2></div>
        <div class="corps">
          <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: '12px', fontSize: '13px' }}>
            <div><div class="discret">Ordre de service</div><div class="fort" style=${{ marginTop: '4px' }}>${dateFr(c.date_os)}</div></div>
            <div><div class="discret">Délai contractuel</div><div class="fort" style=${{ marginTop: '4px' }}>${c.delai_jours ? c.delai_jours + ' jours' : '—'}</div></div>
            <div><div class="discret">Fin prévue</div><div class="fort" style=${{ marginTop: '4px' }}>${dateFr(k.dateFin)}</div></div>
          </div>
          <div style=${{ marginTop: '20px', display: 'flex', flexDirection: 'column', gap: '12px', fontSize: '13px' }}>
            ${k.delaiEcoulePct !== null && Ligne('Délai écoulé', Math.round(k.delaiEcoulePct) + ' % · ' + (k.joursRestants >= 0 ? k.joursRestants + ' j restants' : -k.joursRestants + ' j de retard'), k.delaiEcoulePct, retard ? 'var(--risque)' : 'var(--texte-2)')}
            ${Ligne('Travaux réalisés', Math.round(k.avancement) + ' %', k.avancement, 'var(--progres)')}
            ${Ligne('Budget consommé', Math.round(k.consommation) + ' %', k.consommation, 'var(--accent)')}
          </div>
          ${nb(c.jours_arret) > 0 && html`<p class="discret" style=${{ marginBottom: 0 }}>${c.jours_arret} jours d'arrêt de travaux déjà ajoutés au délai.</p>`}
          ${k.raisons.length > 0 && html`<div class="erreur" style=${{ marginTop: '16px' }}>${k.raisons.join(' ; ')}.</div>`}
        </div>
      </section>
      <section class="carte">
        <div class="tete"><h2>Répartition des charges</h2></div>
        <div class="corps">
          ${parCat.map((p) => html`<div style=${{ display: 'grid', gridTemplateColumns: '140px minmax(0,1fr) 100px', alignItems: 'center', gap: '12px', fontSize: '13px', padding: '7px 0' }}>

        </div>

      </div></section>

// ---------- BPU ----------
function lireBpu(buffer) {
  const wb = XLSX.read(buffer);
  const lignes = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
  const norm = (v) => String(v ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  const nombre = (v) => typeof v === 'number' ? v : Number(String(v ?? '').replace(/[\s  ]/g, '').replace(',', '.'));
  const iTete = lignes.findIndex((l) => l.some((c) => norm(c).includes('designation')));
  if (iTete < 0) throw new Error('Colonne « Désignation » introuvable dans la première feuille.');
  const tete = lignes[iTete].map(norm);
  const col = (re, sauf = []) => tete.findIndex((h, i) => re.test(h) && !sauf.includes(i));
  const cDes = col(/designation/), cPu = col(/prix unitaire|p\.?\s?u\b|unitaire/);
  const cNum = col(/^n|numero|prix n|^art/, [cDes, cPu]), cUnite = col(/^u$|unite/, [cPu]), cQte = col(/quantite|qte|qt/);
  if (cQte < 0 || cPu < 0) throw new Error('Colonnes « Quantité » et « Prix unitaire » introuvables.');
  const res = [];
  for (const l of lignes.slice(iTete + 1)) {
    const des = String(l[cDes] ?? '').trim(), q = nombre(l[cQte]), pu = nombre(l[cPu]);
    if (!des || !Number.isFinite(q) || !Number.isFinite(pu) || String(l[cQte]).trim() === '' || String(l[cPu]).trim() === '') continue;
    res.push({ numero: cNum >= 0 ? String(l[cNum] ?? '').trim() || null : null, designation: des, unite: cUnite >= 0 ? String(l[cUnite] ?? '').trim() || null : null, quantite: q, prix_unitaire: pu });
  }
  if (!res.length) throw new Error('Aucune ligne de prix reconnue sous l’en-tête.');
  return res;
}

function Bpu({ chantierId, rows, reload }) {
  const fichier = useRef(null);
  const [apercu, setApercu] = useState(null);
  const [erreur, setErreur] = useState(null);
  const total = rows.reduce((a, b) => a + nb(b.quantite) * nb(b.prix_unitaire), 0);
  const fait = rows.reduce((a, b) => a + Math.min(nb(b.quantite_realisee), nb(b.quantite)) * nb(b.prix_unitaire), 0);
  async function choisir(e) {
    const f = e.target.files?.[0]; e.target.value = '';
    if (!f) return;
    setErreur(null);
    try { setApercu(lireBpu(await f.arrayBuffer())); } catch (err) { setErreur(err.message); }
  }
  async function importer() {
    if (await ecrire(sb.from('articles_bpu').insert(apercu.map((l, i) => ({ ...l, chantier_id: chantierId, ordre: rows.length + i }))))) { setApercu(null); await reload(); }
  }
  async function ajouter(e) {
    const form = e.currentTarget, f = lireForm(e);
    if (await ecrire(sb.from('articles_bpu').insert({ chantier_id: chantierId, ordre: rows.length, numero: str(f.get('numero')), designation: String(f.get('designation')), unite: str(f.get('unite')), quantite: num(f.get('quantite')), prix_unitaire: num(f.get('prix_unitaire')) }))) { form.reset(); await reload(); }
  }
  async function majRealise(a, v) {
    const q = num(v);
    if (q !== nb(a.quantite_realisee) && await ecrire(sb.from('articles_bpu').update({ quantite_realisee: q }).eq('id', a.id))) await reload();
  }
  return html`
    <div class="tuiles">
      <${Tuile} l="Montant du BPU" v=${dh(total)} s=${'DH HT · ' + rows.length + ' articles'} />
      <${Tuile} l="Travaux réalisés" v=${dh(fait)} s="DH HT" />
      <${Tuile} l="Avancement physique" v=${(total ? Math.round((fait / total) * 100) : 0) + ' %'} s="pondéré par les montants" />
    </div>
    <section class="carte">
      <div class="tete"><h2>Importer le bordereau des prix</h2>
        <div class="rangee">
          <input ref=${fichier} type="file" accept=".xlsx,.xls,.csv" hidden onChange=${choisir} aria-label="Fichier du bordereau des prix" />
          <button type="button" class="btn secondaire" onClick=${() => fichier.current.click()}>Choisir un fichier Excel ou CSV</button>
        </div>
      </div>
      <div class="corps" style=${{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
        <div class="discret">La première feuille doit contenir une ligne d'en-tête avec « Désignation », « Quantité » et « Prix unitaire » (et si possible « N° » et « Unité »).</div>
        ${erreur && html`<div class="erreur">${erreur}</div>`}
        ${apercu && html`
          <div class="note">${apercu.length} articles reconnus, pour ${dh(apercu.reduce((a, l) => a + l.quantite * l.prix_unitaire, 0))} DH HT. Vérifiez les premières lignes puis confirmez.</div>
          <div class="defile"><table>
            <thead><tr><th>N°</th><th>Désignation</th><th>Unité</th><th class="d">Quantité</th><th class="d">PU HT</th></tr></thead>
            <tbody>${apercu.slice(0, 8).map((l) => html`<tr><td>${l.numero}</td><td>${l.designation}</td><td>${l.unite}</td><td class="d">${dh(l.quantite)}</td><td class="d">${dh(l.prix_unitaire)}</td></tr>`)}</tbody>
          </table></div>
          <div class="rangee"><button type="button" class="btn" onClick=${importer}>Importer les ${apercu.length} articles</button><button type="button" class="btn secondaire" onClick=${() => setApercu(null)}>Annuler</button></div>`}
      </div>
    </section>
    <section class="carte">
      <div class="tete"><h2>Articles et quantités réalisées</h2><span class="discret">Saisissez les quantités réalisées à chaque attachement.</span></div>
      <div class="defile">
        <table style=${{ minWidth: '900px' }}>
          <thead><tr><th>N° prix</th><th>Désignation</th><th>Unité</th><th class="d">Qté marché</th><th class="d">PU HT</th><th class="d">Montant HT</th><th class="d">Qté réalisée</th><th style=${{ width: '150px' }}>Avancement</th><th></th></tr></thead>
          <tbody>${rows.map((a) => { const p = nb(a.quantite) ? (nb(a.quantite_realisee) / nb(a.quantite)) * 100 : 0; return html`
            <tr key=${a.id}>
              <td class="discret">${a.numero}</td><td>${a.designation}</td><td>${a.unite}</td>
              <td class="d">${dh(a.quantite)}</td><td class="d">${dh(a.prix_unitaire)}</td><td class="d fort">${dh(nb(a.quantite) * nb(a.prix_unitaire))}</td>
              <td class="d" style=${{ width: '120px' }}><input aria-label=${'Quantité réalisée ' + a.designation} inputmode="decimal" value=${a.quantite_realisee} style=${{ textAlign: 'right' }} onBlur=${(e) => majRealise(a, e.target.value)} /></td>

          <div><button class="btn" type="submit">+ Ajouter l'article</button></div>
        </form>
      </div>
    </section>`;
}

// ---------- Planning (Gantt) ----------
function Planning({ c, rows, bpu, reload }) {
  const fin = dateFinPrevue(c), t = today();
  const dates = [...rows.flatMap((r) => [r.debut, r.fin]), c.date_os, fin, t].filter(Boolean);
  const d0s = dates.reduce((a, b) => (a < b ? a : b), t).slice(0, 8) + '01';
  const fm = new Date(dates.reduce((a, b) => (a > b ? a : b), t) + 'T00:00:00Z'); fm.setUTCMonth(fm.getUTCMonth() + 1, 1);
  const d1s = fm.toISOString().slice(0, 10);
  const d0 = Date.parse(d0s), span = Date.parse(d1s) - d0;
  const pos = (d) => ((Date.parse(d) - d0) / span) * 100;
  const mois = [];
  for (let m = new Date(d0s + 'T00:00:00Z'); m.toISOString().slice(0, 10) < d1s; m.setUTCMonth(m.getUTCMonth() + 1)) {
    const a = m.toISOString().slice(0, 10), n = new Date(m); n.setUTCMonth(n.getUTCMonth() + 1);
    mois.push({ label: MOIS[m.getUTCMonth()] + (m.getUTCMonth() === 0 ? ' ' + m.getUTCFullYear() : ''), l: pos(a), w: pos(n.toISOString().slice(0, 10)) - pos(a) });
  }
  const enRetard = (r) => { const att = Math.max(0, Math.min(100, ((Date.parse(t) - Date.parse(r.debut)) / Math.max(1, Date.parse(r.fin) - Date.parse(r.debut))) * 100)); return nb(r.avancement) < 100 && att - nb(r.avancement) > 15; };
  async function ajouter(e) {
    const form = e.currentTarget, f = lireForm(e);
    if (await ecrire(sb.from('taches').insert({ chantier_id: c.id, nom: String(f.get('nom')), debut: String(f.get('debut')), fin: String(f.get('fin')), avancement: Math.max(0, Math.min(100, num(f.get('avancement')))), ordre: rows.length }))) { form.reset(); await reload(); }
  }
  async function depuisBpu() {
    if (!bpu.length) return alert("Importez d'abord le bordereau des prix.");
    const debut = c.date_os ?? t;
    if (await ecrire(sb.from('taches').insert(bpu.map((a, i) => ({ chantier_id: c.id, nom: (a.numero ? a.numero + ' · ' : '') + a.designation, debut, fin: addDays(debut, 30), avancement: 0, ordre: rows.length + i }))))) await reload();
  }
  return html`
    <div class="entete">
      <div class="discret">OS le ${dateFr(c.date_os)} · délai ${c.delai_jours ?? '—'} jours${nb(c.jours_arret) ? ` + ${c.jours_arret} jours d'arrêt` : ''} · fin contractuelle le ${dateFr(fin)}</div>
      <button type="button" class="btn secondaire" onClick=${depuisBpu}>Créer une tâche par article du BPU</button>
    </div>
    <section class="carte defile" aria-label="Diagramme de Gantt">
      <div class="gantt">
        <div class="rang" style=${{ minHeight: '44px', borderBottom: '1px solid var(--bord)' }}>
          <div class="nom discret fort" style=${{ textTransform: 'uppercase', fontSize: '12px' }}>Tâche</div>
          <div class="piste">${mois.map((m) => html`<div style=${{ position: 'absolute', top: 0, bottom: 0, left: m.l + '%', width: m.w + '%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', fontWeight: 600, color: 'var(--texte-2)' }}>${m.label}</div>`)}</div>
        </div>
        <div class="calque" aria-hidden="true">
          ${mois.map((m) => html`<div style=${{ position: 'absolute', top: 0, bottom: 0, left: m.l + '%', width: '1px', background: 'var(--bord-leger)' }}></div>`)}
          <div title="Aujourd'hui" style=${{ position: 'absolute', top: 0, bottom: 0, left: pos(t) + '%', width: '2px', background: 'var(--accent)' }}></div>
          ${fin && html`<div title="Fin contractuelle" style=${{ position: 'absolute', top: 0, bottom: 0, left: pos(fin) + '%', width: '2px', background: 'var(--risque)' }}></div>`}
        </div>
        ${rows.map((r) => { const late = enRetard(r); return html`
          <div class="rang" key=${r.id}>
            <div class="nom">
              <div class="fort" style=${{ fontSize: '13.5px' }}>${r.nom}</div>
              <div style=${{ display: 'flex', gap: '6px', alignItems: 'center', fontSize: '12px', color: late ? 'var(--risque)' : 'var(--texte-2)' }}>
                ${dateFr(r.debut).slice(0, 5)} → ${dateFr(r.fin).slice(0, 5)} ·
                <input aria-label=${'Avancement ' + r.nom} inputmode="numeric" value=${r.avancement} style=${{ width: '52px', minHeight: '26px', padding: '2px 6px', fontSize: '12px' }} onBlur=${async (e) => { const v = Math.max(0, Math.min(100, num(e.target.value))); if (v !== nb(r.avancement) && await ecrire(sb.from('taches').update({ avancement: v }).eq('id', r.id))) await reload(); }} /> %${late ? ' · en retard' : ''}
                <button type="button" class="btn danger petit" style=${{ minHeight: '24px', padding: '0 6px', marginLeft: 'auto' }} aria-label=${'Supprimer ' + r.nom} onClick=${() => supprimer('taches', r.id, 'Supprimer cette tâche ?', reload)}>×</button>
              </div>
            </div>
            <div class="piste"><div class="bar" style=${{ left: pos(r.debut) + '%', width: Math.max(0.5, pos(r.fin) - pos(r.debut)) + '%', background: late ? '#F4C7C2' : 'var(--progres-clair)' }}><div style=${{ height: '100%', width: nb(r.avancement) + '%', background: 'var(--progres)' }}></div></div></div>
          </div>`; })}
        ${rows.length === 0 && html`<div class="vide">Aucune tâche. Ajoutez-en ci-dessous ou créez-les depuis le BPU.</div>`}
      </div>
    </section>
    <section class="carte">
      <div class="tete"><h2>Ajouter une tâche</h2><span class="discret">Ligne verte : aujourd'hui · ligne rouge : fin contractuelle</span></div>
      <div class="corps">
        <form class="formulaire" onSubmit=${ajouter}>
          <${Champ} id="t-n" label="Tâche" large><input id="t-n" name="nom" required placeholder="Ex. Terrassements" /></${Champ}>
          <${Champ} id="t-d" label="Début"><input id="t-d" name="debut" type="date" required value=${c.date_os ?? t} /></${Champ}>
          <${Champ} id="t-f" label="Fin"><input id="t-f" name="fin" type="date" required /></${Champ}>
          <${Champ} id="t-a" label="Avancement (%)"><input id="t-a" name="avancement" inputmode="numeric" value="0" /></${Champ}>
          <div><button class="btn" type="submit">+ Ajouter</button></div>
        </form>
      </div>
    </section>`;
}

// ---------- Chèques et paiements ----------
function Tresorerie() {
  const cheques = useTable('cheques', null, { col: 'date_echeance', asc: true });
  const fournisseurs = useTable('fournisseurs', null, { col: 'nom' });
  const chantiers = useTable('chantiers', null, { col: 'intitule' });
  const depenses = useTable('depenses');
  const [filtre, setFiltre] = useState('Tous');
  const t = today(), dans7 = addDays(t, 7);
  const emis = cheques.rows.filter((q) => q.statut === 'Émis');
  const proches = emis.filter((q) => q.date_echeance && q.date_echeance <= dans7);
  const du = depenses.rows.reduce((a, d) => a + Math.max(0, nb(d.montant_ttc) - nb(d.montant_paye)), 0);
  const vis = filtre === 'Tous' ? cheques.rows : cheques.rows.filter((q) => q.statut === filtre);
  const nomF = (id) => fournisseurs.rows.find((f) => f.id === id)?.nom;
  const nomC = (id) => chantiers.rows.find((c) => c.id === id)?.intitule ?? '—';
  async function ajouter(e) {
    const form = e.currentTarget, f = lireForm(e);
    const fid = str(f.get('fournisseur_id'));
    if (await ecrire(sb.from('cheques').insert({
      numero: String(f.get('numero')), banque: str(f.get('banque')), fournisseur_id: fid, beneficiaire: str(f.get('beneficiaire')) ?? (fid ? nomF(fid) ?? null : null),
      chantier_id: str(f.get('chantier_id')), montant: num(f.get('montant')), date_emission: String(f.get('date_emission')), date_echeance: str(f.get('date_echeance')),
    }))) { form.reset(); await cheques.reload(); }
  }
  const situation = fournisseurs.rows.map((f) => {
    const deps = depenses.rows.filter((d) => d.fournisseur_id === f.id);
    const facture = deps.reduce((a, d) => a + nb(d.montant_ttc), 0), paye = deps.reduce((a, d) => a + nb(d.montant_paye), 0);
    return { f, facture, paye, reste: facture - paye, enCours: emis.filter((q) => q.fournisseur_id === f.id).reduce((a, q) => a + nb(q.montant), 0) };
  }).filter((s) => s.facture > 0 || s.enCours > 0).sort((a, b) => b.reste - a.reste);
  return html`
    <div class="entete"><h1>Chèques et paiements</h1></div>
    ${cheques.error && html`<div class="erreur">${cheques.error}</div>`}
    <div class="tuiles">
      <${Tuile} l="Chèques émis non encaissés" v=${dh(emis.reduce((a, q) => a + nb(q.montant), 0))} s=${emis.length + ' chèque(s)'} />
      <${Tuile} l="À provisionner sous 7 jours" v=${dh(proches.reduce((a, q) => a + nb(q.montant), 0))} couleur=${proches.length ? 'var(--alerte)' : null} s=${proches.length + " chèque(s), jusqu'au " + dateFr(dans7).slice(0, 5)} />
      <${Tuile} l="Dû aux fournisseurs" v=${dh(du)} s="factures non réglées, tous chantiers" />
    </div>
    <section class="carte">
      <div class="tete"><h2>Enregistrer un chèque</h2></div>
      <div class="corps">
        <form class="formulaire" onSubmit=${ajouter}>
          <${Champ} id="q-n" label="N° du chèque"><input id="q-n" name="numero" required /></${Champ}>
          <${Champ} id="q-b" label="Banque"><input id="q-b" name="banque" /></${Champ}>
          <${Champ} id="q-f" label="Fournisseur"><select id="q-f" name="fournisseur_id"><option value="">—</option>${fournisseurs.rows.map((f) => html`<option value=${f.id}>${f.nom}</option>`)}</select></${Champ}>
          <${Champ} id="q-be" label="Autre bénéficiaire"><input id="q-be" name="beneficiaire" placeholder="si pas dans la liste" /></${Champ}>
          <${Champ} id="q-c" label="Chantier"><select id="q-c" name="chantier_id"><option value="">—</option>${chantiers.rows.map((c) => html`<option value=${c.id}>${c.intitule}</option>`)}</select></${Champ}>
          <${Champ} id="q-m" label="Montant (DH)"><input id="q-m" name="montant" inputmode="decimal" required /></${Champ}>
          <${Champ} id="q-de" label="Émis le"><input id="q-de" name="date_emission" type="date" required value=${t} /></${Champ}>
          <${Champ} id="q-ech" label="Échéance"><input id="q-ech" name="date_echeance" type="date" /></${Champ}>
          <div><button class="btn" type="submit">+ Enregistrer</button></div>
        </form>
      </div>
    </section>
    <section class="carte">
      <div class="tete"><h2>Registre des chèques</h2>
        <div class="rangee" role="group" aria-label="Filtrer par statut">${['Tous', ...STATUTS_CHEQUE].map((s) => html`<button type="button" class="pilule" aria-pressed=${String(filtre === s)} onClick=${() => setFiltre(s)}>${s}</button>`)}</div>
      </div>
      <div class="defile">
        <table style=${{ minWidth: '960px' }}>
          <thead><tr><th>N° chèque</th><th>Bénéficiaire</th><th>Chantier</th><th>Banque</th><th>Émis le</th><th>Échéance</th><th class="d">Montant (DH)</th><th>Statut</th><th></th></tr></thead>
          <tbody>${vis.map((q) => { const proche = q.statut === 'Émis' && q.date_echeance && q.date_echeance <= dans7; return html`
            <tr key=${q.id}>
              <td class="fort">${q.numero}</td><td>${q.beneficiaire ?? nomF(q.fournisseur_id) ?? '—'}</td><td>${nomC(q.chantier_id)}</td><td>${q.banque}</td><td>${dateFr(q.date_emission)}</td>
              <td style=${proche ? { color: 'var(--alerte)', fontWeight: 600 } : null}>${dateFr(q.date_echeance)}${proche ? (q.date_echeance < t ? ' · dépassée' : ' · cette semaine') : ''}</td>
              <td class="d fort">${dh(q.montant)}</td>
              <td style=${{ width: '140px' }}><select aria-label=${'Statut chèque ' + q.numero} value=${q.statut} onChange=${async (e) => { if (await ecrire(sb.from('cheques').update({ statut: e.target.value }).eq('id', q.id))) await cheques.reload(); }}>${STATUTS_CHEQUE.map((s) => html`<option>${s}</option>`)}</select></td>
              <td><${BtnSuppr} label=${'chèque ' + q.numero} onClick=${() => supprimer('cheques', q.id, 'Supprimer ce chèque ?', cheques.reload)} /></td>
            </tr>`; })}</tbody>
        </table>
        ${vis.length === 0 && html`<div class="vide">Aucun chèque.</div>`}
      </div>
    </section>
    <section class="carte">
      <div class="tete"><h2>Situation des fournisseurs</h2></div>
      <div class="defile">
        <table style=${{ minWidth: '720px' }}>
          <thead><tr><th>Fournisseur</th><th>Catégorie</th><th class="d">Facturé (DH)</th><th class="d">Payé (DH)</th><th class="d">Reste dû (DH)</th><th class="d">Chèques en circulation</th></tr></thead>
          <tbody>${situation.map((s) => html`<tr><td class="fort">${s.f.nom}</td><td>${s.f.categorie}</td><td class="d">${dh(s.facture)}</td><td class="d">${dh(s.paye)}</td><td class="d fort">${dh(s.reste)}</td><td class="d">${dh(s.enCours)}</td></tr>`)}</tbody>
        </table>
        ${situation.length === 0 && html`<div class="vide">Aucune facture fournisseur enregistrée.</div>`}
      </div>
    </section>`;
}

// ---------- Fournisseurs ----------
function Fournisseurs() {
  const f = useTable('fournisseurs', null, { col: 'nom' });
  async function ajouter(e) {
    const form = e.currentTarget, d = lireForm(e);
    if (await ecrire(sb.from('fournisseurs').insert({ nom: String(d.get('nom')), categorie: str(d.get('categorie')), ice: str(d.get('ice')), rib: str(d.get('rib')), telephone: str(d.get('telephone')) }))) { form.reset(); await f.reload(); }
  }
  return html`
    <div class="entete"><h1>Fournisseurs et sous-traitants</h1></div>
    <section class="carte">
      <div class="tete"><h2>Ajouter un fournisseur</h2></div>
      <div class="corps">
        <form class="formulaire" onSubmit=${ajouter}>
          <${Champ} id="f-n" label="Raison sociale"><input id="f-n" name="nom" required /></${Champ}>
          <${Champ} id="f-c" label="Catégorie"><input id="f-c" name="categorie" placeholder="Ciment, fer, transport…" /></${Champ}>
          <${Champ} id="f-i" label="ICE"><input id="f-i" name="ice" /></${Champ}>
          <${Champ} id="f-r" label="RIB"><input id="f-r" name="rib" /></${Champ}>
          <${Champ} id="f-t" label="Téléphone"><input id="f-t" name="telephone" type="tel" /></${Champ}>
          <div><button class="btn" type="submit">+ Ajouter</button></div>
        </form>
      </div>
    </section>
    <section class="carte">
      <div class="defile">
        <table style=${{ minWidth: '700px' }}>
          <thead><tr><th>Raison sociale</th><th>Catégorie</th><th>ICE</th><th>RIB</th><th>Téléphone</th><th></th></tr></thead>
          <tbody>${f.rows.map((x) => html`<tr key=${x.id}><td class="fort">${x.nom}</td><td>${x.categorie}</td><td>${x.ice}</td><td class="discret">${x.rib}</td><td>${x.telephone}</td>
            <td><${BtnSuppr} label=${x.nom} onClick=${() => supprimer('fournisseurs', x.id, 'Supprimer ce fournisseur ?', f.reload)} /></td></tr>`)}</tbody>
        </table>
        ${f.rows.length === 0 && !f.loading && html`<div class="vide">Aucun fournisseur.</div>`}
      </div>
    </section>`;
}

// ---------- Application ----------
function App() {
  const route = useRoute();
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    if (!CONFIG_OK) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (!CONFIG_OK) return html`<div class="contenu"><div class="erreur">Supabase n'est pas configuré. Ouvrez index.html sur GitHub (icône crayon) et remplacez, en haut du fichier, VOTRE-PROJET et VOTRE-CLE-PUBLIQUE par les valeurs de Supabase › Project Settings › API.</div></div>`;
  if (session === undefined) return html`<div class="contenu discret">Chargement…</div>`;
  if (!session) return html`<${Login} />`;
  let page;
  if (route.startsWith('/chantier/')) page = html`<${Fiche} key=${route} id=${route.slice('/chantier/'.length)} />`;
  else if (route === '/nouveau') page = html`<${NouveauChantier} />`;
  else if (route === '/tresorerie') page = html`<${Tresorerie} />`;
  else if (route === '/fournisseurs') page = html`<${Fournisseurs} />`;
  else page = html`<${TableauDeBord} />`;
  return html`<${Cadre} route=${route} email=${session.user.email}>${page}</${Cadre}>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
